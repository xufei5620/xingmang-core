events {}

http {
    server_tokens off;
    access_log off;

    # Resolve the api upstream at request time, not once at worker start.
    #
    # 2026-09-06 incident: a roll-forward restarted the api after this proxy
    # had already resolved it, the api came back on a different address, and
    # nginx kept posting every source batch to the dead one -- HTTP 502 with
    # "connect() failed (111: Connection refused)" for 27 minutes, which the
    # agents reported as an ingestion outage. The roll-forward script has a
    # step whose whole purpose is to restart this proxy afterwards, and it was
    # skipped because an earlier step had already failed. Ordering alone
    # cannot be the guarantee: any future restart, rescheduling or IPAM
    # reassignment recreates the same trap.
    #
    # 127.0.0.11 is Docker's embedded DNS, reachable from every container on a
    # user-defined network. valid=10s overrides its 600s TTL so a moved api is
    # picked up within ten seconds. ipv6=off because these networks are IPv4
    # only and an AAAA lookup would just add latency to every miss.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8443 ssl;
        server_name invoice-ingest.internal;

        ssl_certificate     /run/secrets/ingest_server_cert;
        ssl_certificate_key /run/secrets/ingest_server_key;
        ssl_client_certificate /run/secrets/source_agent_ca;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 5m;

        location = /internal/v1/source-batches {
            limit_except POST { deny all; }
            # A variable in proxy_pass is what forces the runtime lookup: with a
            # literal name nginx resolves once at start and caches the address
            # for the life of the worker. No URI part after the host, so the
            # request URI is passed through unchanged, exactly as before.
            set $ingest_upstream platform-api;
            proxy_pass http://$ingest_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header Host invoice-ingest.internal;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Invoice-mTLS-Verified $ssl_client_verify;
            proxy_set_header X-Invoice-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Mock-User-ID "";
            proxy_set_header X-Mock-Role "";
            proxy_request_buffering on;
        }

        location / { return 404; }
    }
}

# Install this file in the Nginx `http {}` context before enabling the vhost.
# It contains no secret and is intentionally separate because limit_req_zone is
# invalid inside a server block.
limit_req_zone $binary_remote_addr zone=invoice_public_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=invoice_auth:10m rate=20r/m;
# Keycloak back-channel logout is signed and replay-protected, but multiple
# users may be revoked from one IdP egress address at once. Keep it out of the
# browser-auth bucket so an IdP burst cannot silently lose session revocations.
limit_req_zone $binary_remote_addr zone=invoice_backchannel:10m rate=300r/m;

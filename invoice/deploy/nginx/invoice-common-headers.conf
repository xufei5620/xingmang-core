proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;

# Always overwrite credential- and identity-bearing headers received from the
# internet. `$remote_addr` is already normalized by the host Cloudflare real-IP
# policy; direct clients cannot choose these values.
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Mock-User-ID "";
proxy_set_header X-Mock-Role "";
proxy_set_header X-Invoice-Client-Cert-Serial "";

proxy_hide_header X-Powered-By;

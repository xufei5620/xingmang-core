server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://api.solov.cc https://api2.solov.cc https://xm.solov.cc https://xm2.solov.cc" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Defining any add_header in a location stops normal inheritance from
        # the server block, so repeat the security policy explicitly.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://api.solov.cc https://api2.solov.cc https://xm.solov.cc https://xm2.solov.cc" always;
    }

    # The admin SPA route needs its own frame-ancestors here, not just at the
    # host nginx layer (deploy/nginx/invoice.solov.cc.conf.template): this
    # container has no visibility into the outer proxy's path, so its own
    # catch-all `location /` below sends every path -- /admin included -- the
    # *user*-embed frame-ancestors list (api.solov.cc etc). Multiple
    # Content-Security-Policy headers combine as the intersection of every
    # directive they share, so leaving /admin governed only by that catch-all
    # while the host layer allows https://console.solov.cc would intersect to
    # an *empty* allowed set for /admin -- opaquely blocking the very framing
    # CR-0005 approved, the same failure mode as never updating either layer
    # away from 'none'. Scripts/styles/etc. stay identical to the rest of the
    # SPA; only frame-ancestors differs for this one route.
    #
    # /admin is itself never a real file (React Router client-side route), so
    # try_files always falls through to its last argument -- and a *literal
    # path* there (like the catch-all's plain /index.html below) triggers an
    # internal redirect that re-enters normal location matching for the new
    # URI, landing back in whichever location actually matches /index.html
    # (the catch-all), whose own add_header set then governs the response
    # instead of this one's. A *named* location sidesteps that: it is invoked
    # directly, with no re-match, so its own headers are the ones that stick.
    location = /admin {
        try_files $uri $uri/ @admin_spa;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ @admin_spa;
    }

    location @admin_spa {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://console.solov.cc" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://api.solov.cc https://api2.solov.cc https://xm.solov.cc https://xm2.solov.cc" always;
    }
}

# 可选：启用 XM_FINANCE_COLLECT_SECRET_PROVIDER=file 时复制为
# finance-secrets.override.yaml，并在未入库的 .env 中设置宿主机目录。
# 不要把真实凭据目录提交到仓库；挂载始终只读。
services:
  platform-worker:
    volumes:
      - type: bind
        source: ${XM_FINANCE_COLLECT_SECRET_HOST_ROOT:?set XM_FINANCE_COLLECT_SECRET_HOST_ROOT in the local env}
        target: /run/xm/finance-secrets
        read_only: true

# 星芒统一控制平台 —— staging 一键启动栈（XM-0023）
#
# 用法见 docs/runbooks/LAUNCH.md。最短路径：
#   cp deploy/compose/.env.example deploy/compose/.env   # 然后填密码
#   docker compose -p xingmang-launch -f deploy/compose/launch.yaml up -d --wait
#
# 为什么用独立的项目名 xingmang-launch：
#   本机上已经跑着 deploy/compose/dev.yaml 起的开发库（compose-postgres-1）。
#   独立项目名 = 独立网络 + 独立卷 + 独立容器名，这个栈起停不会碰到它。
#   也刻意不发布 5432/5433，避免和它抢端口。
#
# 版本纪律（宪法 §4 / VERSIONS.lock）：所有镜像钉到具体版本，禁止 latest。
# postgres 连 digest 一起钉——tag 会被上游重新指向，digest 不会。
name: xingmang-launch

services:
  # ==========================================================================
  # 数据库
  # ==========================================================================
  postgres:
    image: docker.io/library/postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    # VERSIONS.lock 记录的是 amd64 清单
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xingmang}
      POSTGRES_USER: ${POSTGRES_USER:-xingmang}
      # 密码走 Docker secret 文件，不作为环境变量出现在容器 inspect 里
      POSTGRES_PASSWORD_FILE: /run/secrets/database__postgres_password
    secrets:
      - source: database__postgres_password
        target: database__postgres_password
    volumes:
      # ⚠️ PG18 必须挂 /var/lib/postgresql，**不是** /var/lib/postgresql/data。
      # PG18 把集群放在按大版本分的子目录下（.../18/docker），挂到 data 上
      # 会让初始化脚本看到一个「非空但不是集群」的目录，容器起不来。
      # 这是实测踩过的坑，不要"顺手改回去"。
      - postgres18-data:/var/lib/postgresql
    # 刻意不发布端口：本栈内部互通即可。宿主要连库时用
    # `docker compose -p xingmang-launch exec postgres psql`，
    # 既不占 5432/5433，也不把库暴露到宿主网络。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==========================================================================
  # 一次性：数据库迁移（Platform Lifecycle Operation，宪法 3 条）
  # ==========================================================================
  # 两步都在这个容器里跑完（见 deploy/docker/migrate-entrypoint.sh）：
  #   1. db/migrations/*.sql   —— cmd/migrate（golang-migrate）
  #   2. River 表结构          —— platform-worker -migrate（River pinned bundle）
  # restart: "no" —— 迁移失败必须停在那里让人看，不能自动重试到看起来成功。
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      target: migrate
      args:
        BUILD_VERSION: ${BUILD_VERSION:-staging}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: xingmang/migrate:${BUILD_VERSION:-staging}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      # DSN 不含密码（宪法 7 条）；密码经 CredentialRef 解析
      DATABASE_URL: postgres://${POSTGRES_USER:-xingmang}@postgres:5432/${POSTGRES_DB:-xingmang}?sslmode=disable
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:-secret://database/postgres-password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required, see deploy/compose/.env.example}

  # --------------------------------------------------------------------------
  # 一次性：Runway 阈值 bootstrap（仅 tools profile）
  # --------------------------------------------------------------------------
  # 把旧版 API/worker 的环境变量导入 finance current/history。它不参与普通
  # `up`，也不覆盖已有不同配置；需要人工核对时显式运行一次即可。
  runway-threshold-bootstrap:
    profiles: ["tools"]
    image: xingmang/migrate:${BUILD_VERSION:-staging}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/runway-threshold-bootstrap"]
    command: ["up"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgres://${POSTGRES_USER:-xingmang}@postgres:5432/${POSTGRES_DB:-xingmang}?sslmode=disable
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:-secret://database/postgres-password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      XM_FINANCE_RUNWAY_WARN_DAYS: ${XM_FINANCE_RUNWAY_WARN_DAYS:-}
      XM_FINANCE_RUNWAY_CRIT_DAYS: ${XM_FINANCE_RUNWAY_CRIT_DAYS:-}

  # --------------------------------------------------------------------------
  # 一次性：本地登录第一个员工账号 bootstrap（仅 tools profile，XM-LOGIN）
  # --------------------------------------------------------------------------
  # 只在 XM_AUTH_MODE=local 时需要：staff.account.create Action 要求一个已经
  # 持有 staff.manage 的身份才能创建账号，而冷启动时压根没有任何本地账号
  # 存在——这是"先有蛋还是先有鸡"的缺口，只能用一条 Platform Lifecycle
  # Operation 补上（同 runway-threshold-bootstrap 的理由）。幂等：账号已
  # 存在就打印 exists 并原样退出，不覆盖角色或密码。
  # ⚠️ XM_STAFF_BOOTSTRAP_PASSWORD 留空会生成一个随机初始密码并打印到 stdout
  #    ——这是它唯一出现的地方，运行后请立即转交本人并清理终端历史/CI 日志。
  staff-bootstrap:
    profiles: ["tools"]
    image: xingmang/migrate:${BUILD_VERSION:-staging}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/staff-bootstrap"]
    command: ["up"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgres://${POSTGRES_USER:-xingmang}@postgres:5432/${POSTGRES_DB:-xingmang}?sslmode=disable
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:-secret://database/postgres-password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      # 两个 bootstrap 变量透传自宿主环境。**不用 `:?` 必填闸**——compose 在
      # `config` 阶段会对全部 service 展开插值，不论 tools profile 有没有被
      # 启用；给它一个必填闸会让任何人跑一次普通的 `docker compose config`
      # 校验（这条门禁本身就是）都得先设一个只有跑 bootstrap 才用得到的
      # 变量。必填改由 Go 侧强制（缺 XM_STAFF_BOOTSTRAP_USERNAME 直接
      # os.Exit(2)），与 runway-threshold-bootstrap 同一处理方式。
      # 密码变量同样留空默认——不给它任何默认值，是为了不让一个
      # "大家都知道"的初始密码比命令自己生成的更危险。
      XM_STAFF_BOOTSTRAP_USERNAME: ${XM_STAFF_BOOTSTRAP_USERNAME:-}
      XM_STAFF_BOOTSTRAP_PASSWORD: ${XM_STAFF_BOOTSTRAP_PASSWORD:-}

  # ==========================================================================
  # 一次性：Bootstrap 引导数据（Platform Lifecycle Operation，宪法 3 条）
  # ==========================================================================
  # 幂等 SQL，为什么不走 Action 见脚本头部注释。
  # 用 postgres 镜像自带的 psql，不额外引入一个镜像版本要治理。
  bootstrap:
    image: docker.io/library/postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    platform: linux/amd64
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-xingmang}
      PGDATABASE: ${POSTGRES_DB:-xingmang}
      PGPASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - ../bootstrap:/bootstrap:ro
    # -v ON_ERROR_STOP=1：任何一条 SQL 出错都要非零退出，
    # 否则 psql 会跳过错误继续跑，最后以 0 退出，栈起来了但数据不对
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/001_staging_seed.sql"]

  # ==========================================================================
  # Platform API
  # ==========================================================================
  platform-api:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      target: platform-api
      args:
        BUILD_VERSION: ${BUILD_VERSION:-staging}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: xingmang/platform-api:${BUILD_VERSION:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # staging：dev-header 鉴权仍可用（XM_AUTH_MODE 的默认值跟着本变量走）。
      # 改成 production 而**不**同时切到 OIDC，本进程会拒绝启动——这是有意的闸，
      # 上生产必须先完成 CR-0001（Keycloak/OIDC）。
      #
      # XM_AUTH_MODE / XM_OIDC_* 已在下方透传（默认留空=按 ENVIRONMENT 取默认）；
      #    切换真实登录的步骤与审定要求见 docs/modules/httpapi/AUTH-SWITCH.md。
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      # 容器内必须绑 0.0.0.0：默认的 127.0.0.1 是给「宿主直跑 + 宿主 Nginx
      # 反代」形态用的，在容器里会让 web 反代连不上
      LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-xingmang}@postgres:5432/${POSTGRES_DB:-xingmang}?sslmode=disable
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:-secret://database/postgres-password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      # /api/v1 的限流配额（XM-R011）。每 (Principal, 路由) 每分钟的请求数 +
      # 瞬时并发额度。**关不掉**：填 0 或负数会让 API 拒绝启动——要放宽就填一个
      # 更大的数字，那是一个看得见的决定。探针（/healthz、/readyz）不受影响。
      # ⚠️ 计数在**进程内存**里，多副本时每个副本各算各的（实际额度是副本数倍）。
      XM_RATE_LIMIT_PER_MINUTE: ${XM_RATE_LIMIT_PER_MINUTE:-120}
      XM_RATE_LIMIT_BURST: ${XM_RATE_LIMIT_BURST:-20}
      # --- 请求详情 / reqlog 只读网关（XM-0039，交接文档 §9.4）--------------
      # 数据源是生产上已在运行的**外挂**「请求审计系统」，平台只做带权限与
      # 审计的只读网关：请求正文永不落平台库、不缓存、默认不可导出。
      #
      # 默认 off（不是 fake）：两个端点整组不挂载。这条通道读的是用户与模型的
      # 完整对话，一个默认开着的 fake 会把编造的问答摆进一个长得像真的详情页，
      # 而有人会照着它回复客诉。要演示就显式配 fake，那是一次有意的选择。
      #
      # ⚠️ 生产不接受 fake（启动即拒）；real 现在也读不出数据——控制台 API
      #    形状未核实（见 contracts/connectors/reqlog.read.v1.md §8），端点会
      #    返回 501。real 还有一处未拍板的冲突：控制台是 http://127.0.0.1:9300
      #    而只读连接配置要求 https（同文档 §5）。
      # --- 成本线演示种子(XM-0037d):非生产演示用,生产模式进程内硬拒 ---
      XM_FINANCE_FAKE_SEED: ${XM_FINANCE_FAKE_SEED:-false}
      # --- 鉴权模式(XM-0008/XM-AUTH1):默认 dev-header;切 Keycloak 时在 .env 设 oidc 三件套 ---
      XM_AUTH_MODE: ${XM_AUTH_MODE:-}
      XM_OIDC_ISSUER: ${XM_OIDC_ISSUER:-}
      XM_OIDC_AUDIENCE: ${XM_OIDC_AUDIENCE:-}
      XM_OIDC_JWKS_URL: ${XM_OIDC_JWKS_URL:-}
      XM_OIDC_ROLE_SCOPES: ${XM_OIDC_ROLE_SCOPES:-}
      XM_OIDC_CLOCK_SKEW: ${XM_OIDC_CLOCK_SKEW:-}
      # 管理员来源 IP 名单（XM-AUTH-TOTP0/CR-0006 c 条）：逗号分隔 CIDR，空=不启用。
      # 只对已经/将要被要求启用 TOTP 的账号（管理员）生效；留空即维持今天的行为
      # （不限制来源）。启用前请先读 docs/modules/httpapi/AUTH-SWITCH.md §11.7。
      XM_CONSOLE_ADMIN_IP_ALLOWLIST: ${XM_CONSOLE_ADMIN_IP_ALLOWLIST:-}
      # --- 开票管理员断言签发（CR-0006/XM-INVCON1）：默认关闭，只装能力不激活 --
      # 启用前置条件：XM_AUTH_MODE=local（断言依赖本地登录的 TOTP 新鲜度
      # mfa_at，oidc/dev-header 两种身份解析器都不填充它）。启用后还需要：
      # ① 用 cmd/console-assertion-keygen 生成一把 Ed25519 密钥，把私钥经
      #    credential.secret.upsert 存到 XM_INVOICE_CONSOLE_ASSERTION_KEY_REF
      #    指向的引用（形如 secret://console-assertion/signing-key-<key_id>）；
      # ② 把同一次生成的公钥清单条目提交进本仓库与开票仓库各自的
      #    contracts/auth/console-assertion-keyring.v1.json（两边必须一致）；
      # ③ 与开票侧核对 CONSOLE_ASSERTION_ISSUER/CONSOLE_ASSERTION_AUDIENCE 取值
      #    逐字相同——断言的 iss/aud 是两侧各自独立配置的，不是同一个值自动
      #    同步。详见 docs/handoffs/slices/XM-INVCON1.md「生产上线步骤」。
      XM_INVOICE_CONSOLE_ASSERTION_ENABLED: ${XM_INVOICE_CONSOLE_ASSERTION_ENABLED:-false}
      # 精确 https 来源（不带路径/查询/片段），即断言的 iss claim，也应等于
      # 开票侧 CONSOLE_ASSERTION_ISSUER 与要求的 Origin 头。
      XM_INVOICE_CONSOLE_ASSERTION_ISSUER: ${XM_INVOICE_CONSOLE_ASSERTION_ISSUER:-}
      # 留空即用内置默认值 xingmang-console-assertion-v1，与开票侧
      # CONSOLE_ASSERTION_AUDIENCE 的默认值一致，通常不需要改。
      XM_INVOICE_CONSOLE_ASSERTION_AUDIENCE: ${XM_INVOICE_CONSOLE_ASSERTION_AUDIENCE:-}
      # 签名私钥的 CredentialRef，形如
      # secret://console-assertion/signing-key-2026-09——key_id（示例里的
      # "2026-09"）同时也是 JWS 的 kid，两者永远一致，不需要另配一个 kid 变量。
      XM_INVOICE_CONSOLE_ASSERTION_KEY_REF: ${XM_INVOICE_CONSOLE_ASSERTION_KEY_REF:-}
      # 断言签发前要求 mfa_at 在此时长内（步进新鲜度）；留空用默认 10 分钟，
      # 与开票侧 AdminPolicy.StepUpMaxAge 现有默认值一致。
      XM_INVOICE_CONSOLE_ASSERTION_STEP_UP_MAX_AGE: ${XM_INVOICE_CONSOLE_ASSERTION_STEP_UP_MAX_AGE:-}
      XM_REQLOG_MODE: ${XM_REQLOG_MODE:-off}
      # Infini 卡服务（XM-CARD）：off / fake / real。**默认 off 且必须显式开**
      # ——这些 Action 会花真钱，一个默认挂上开卡按钮的环境迟早有人在以为是
      # 演示的地方点下去。real 模式缺任何一项配置都拒绝启动。凭据只经
      # CredentialRef，明文进 xm-secrets 卷。
      #
      # 平台同时管理两个 Infini 账号（内部运营维度，不进客户侧）。账号 id
      # 要拼进变量名，所以 compose 只能**枚举**——改账号 id 时这里与 .env
      # 都要跟着改。金额上限按账号各配一份：两个账号的资金是分开的，
      # 用一套全局上限会让「单日 500」变成两个账号抢同一个额度。
      XM_CARDS_MODE: ${XM_CARDS_MODE:-off}
      XM_CARDS_BASE_URL: ${XM_CARDS_BASE_URL:-}
      XM_CARDS_ACCOUNTS: ${XM_CARDS_ACCOUNTS:-}
      XM_CARDS_CHRIS_LIMIT_PER_OPERATION: ${XM_CARDS_CHRIS_LIMIT_PER_OPERATION:-}
      XM_CARDS_CHRIS_LIMIT_PER_DAY: ${XM_CARDS_CHRIS_LIMIT_PER_DAY:-}
      XM_CARDS_LINFENG_LIMIT_PER_OPERATION: ${XM_CARDS_LINFENG_LIMIT_PER_OPERATION:-}
      XM_CARDS_LINFENG_LIMIT_PER_DAY: ${XM_CARDS_LINFENG_LIMIT_PER_DAY:-}
      # 提现额度**不在这里**：它存在库里，由管理端的
      # cards.withdraw.limit.set Action 调整（产品负责人 2026-09-05 决定：
      # 一个要登服务器改文件再重启才能动的数字，实际上没人会去动）。
      # 改它要 fund.limit.manage 权限（admin），与提现的 fund.withdraw
      # （fund-operator）分持——两把钥匙，拿到任一把都搬不空资金池。
      # 用户清单模式（XM-0046）：off / fake / real。留空沿用进程默认 fake；
      # 生产应显式 off——real 客户端未交付前，fake 客户不得出现在生产页面。
      XM_PLATFORM_USERS_MODE: ${XM_PLATFORM_USERS_MODE:-}
      # 平台支付模式（off / fake / real）。留空 = 进程默认 fake。
      XM_PLATFORM_PAYMENTS_MODE: ${XM_PLATFORM_PAYMENTS_MODE:-}
      # Payments API defaults share the worker's existing connection settings.
      XM_SUB2API_ENDPOINT: ${XM_SUB2API_ENDPOINT:-}
      XM_SUB2API_TARGET_ALLOWLIST: ${XM_SUB2API_TARGET_ALLOWLIST:-}
      XM_SUB2API_CREDENTIAL_REF: ${XM_SUB2API_CREDENTIAL_REF:-}
      XM_SUB2API_INSTANCE_ID: ${XM_SUB2API_INSTANCE_ID:-sub2api-staging}
      XM_NEWAPI_ENDPOINT: ${XM_NEWAPI_ENDPOINT:-}
      XM_NEWAPI_TARGET_ALLOWLIST: ${XM_NEWAPI_TARGET_ALLOWLIST:-}
      XM_NEWAPI_CREDENTIAL_REF: ${XM_NEWAPI_CREDENTIAL_REF:-}
      XM_NEWAPI_INSTANCE_ID: ${XM_NEWAPI_INSTANCE_ID:-newapi-staging}
      XM_NEWAPI_USER_ID: ${XM_NEWAPI_USER_ID:-}
      # 接码（XM-SMS0）：off / fake / real。**这是接码唯一的环境变量**——
      # 开哪几家供应商在管理后台点（sms.provider_status.enabled，
      # Action sms.provider.set_enabled@1），不落配置文件。
      # 留在这里的理由只有一个：它决定这个进程会不会花真钱。
      XM_SMS_MODE: ${XM_SMS_MODE:-off}
      # 被动保障探测（ADR-019）。ENABLED 是全局 Kill Switch，留空 = false；
      # 两个进程各自独立解析同一个变量，**必须在两段都透传且配同一个值**。
      XM_ASSURE_PROBE_ENABLED: ${XM_ASSURE_PROBE_ENABLED:-}
      XM_ASSURE_PROBE_DAILY_BUDGET: ${XM_ASSURE_PROBE_DAILY_BUDGET:-}
      XM_REQLOG_ENDPOINT: ${XM_REQLOG_ENDPOINT:-}
      XM_REQLOG_TOKENMAP_V2: ${XM_REQLOG_TOKENMAP_V2:-}
      XM_REQLOG_TARGET_ALLOWLIST: ${XM_REQLOG_TARGET_ALLOWLIST:-}
      XM_REQLOG_CREDENTIAL_REF: ${XM_REQLOG_CREDENTIAL_REF:-}
      # 控制台 Basic Auth 的 `用户名:口令` **整串**。默认空：没配就是没有真实
      # 读取能力，而不是拿占位值去连（宪法 7 条：凭据只经 CredentialRef，
      # 这个变量只是 env Provider 的落点，Connector 并不认识它）。
      XM_REQLOG_TOKEN: ${XM_REQLOG_TOKEN:-}
      XM_REQLOG_TIMEOUT: ${XM_REQLOG_TIMEOUT:-30s}
      # --- file 模式（XM-REQLOG-MERGE）：直读记录代理落盘的数据，不经 HTTP --
      # 只在 XM_REQLOG_MODE=file 时用到。DataDir 是**容器内**路径，默认值与
      # server-prod.yaml 的只读绑定挂载目标一致；本文件（staging 默认栈）
      # 不挂载对应的宿主机目录，留空/默认值在这里不会指向真实数据——staging
      # 若要联调 file 模式，需要另外提供挂载（见
      # docs/runbooks/REQLOG-RECORDER.md）。
      XM_REQLOG_DATA_DIR: ${XM_REQLOG_DATA_DIR:-}
      # 令牌映射路径可留空——留空即没有用户名映射能力（Username 恒为空串，
      # 契约允许的合法状态），不是错误。
      XM_REQLOG_TOKENMAP: ${XM_REQLOG_TOKENMAP:-}
      # --- CPA 逐 key 用量（XM-CPA0）：只读文件后端，与 reqlog file 模式同一
      # 条纪律（直读只读挂载的本机文件，不经 HTTP，没有凭据）--------------
      # 默认 off：两个 platforms/cpa/keys 端点不挂载。本 staging 基线不挂
      # 对应宿主目录；联调 file 模式时须另加明确的只读覆盖（生产见
      # server-prod.yaml），且不得挂 auths/config.yaml 等凭据文件。
      XM_CPA_MODE: ${XM_CPA_MODE:-off}
      XM_CPA_DATA_DIR: ${XM_CPA_DATA_DIR:-}
      XM_CPA_FILE_NAME: ${XM_CPA_FILE_NAME:-}
      # --- 凭据登记（XM-CRED0）--------------------------------------------
      # 运营在后台粘贴的上游凭据落在这个目录（<root>/<scope>/<name>），
      # DB 只存指纹与版本。API 是唯一的写方；worker 以只读方式挂同一个卷。
      XM_SECRET_ROOT: ${XM_SECRET_ROOT:-/run/xm/secrets}
      # --- 运行保障总览（XM-OPS0）------------------------------------------
      # 告警投递配置状态只回布尔值（是否配置了 Telegram/Webhook），从不回
      # 引用或地址；三个变量与下面 platform-worker 读的是**同一份值**——
      # 两个进程按同一个 .env 部署时天然一致。⚠️ 有意不透传
      # XM_ALERT_TELEGRAM_TOKEN（Bot Token 明文）：platform-api 只需要判断
      # 「配没配」，没有任何合法理由持有这把凭据的明文。
      XM_ALERT_TELEGRAM_BOT_REF: ${XM_ALERT_TELEGRAM_BOT_REF:-}
      XM_ALERT_TELEGRAM_CHAT_ID: ${XM_ALERT_TELEGRAM_CHAT_ID:-}
      XM_ALERT_WEBHOOK_URL: ${XM_ALERT_WEBHOOK_URL:-}
      # --- 周期任务部署配置（XM-OPS-TAILS0）---------------------------------
      # 「后台任务」页要如实回答"这个周期任务在这套部署里是否配置为启用、
      # 配的周期是多久"（jobs.DeployedSchedulesFromEnv）。这不是本进程新增
      # 的一条采集链路——本进程从不用这些变量构造任何客户端或注册任何任务，
      # 只是**只读解析**，与下面 platform-worker 用同一套变量名/同一套
      # 解析规则，让两个进程在正常部署（同一份 .env）下得出一致的结论。
      # 值本身与 platform-worker 那份逐条对齐，改一处务必同改两处。
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-1m}
      XM_SUB2API_SYNC_ENABLED: ${XM_SUB2API_SYNC_ENABLED:-true}
      XM_SUB2API_SYNC_INTERVAL: ${XM_SUB2API_SYNC_INTERVAL:-300s}
      XM_NEWAPI_SYNC_ENABLED: ${XM_NEWAPI_SYNC_ENABLED:-true}
      XM_NEWAPI_SYNC_INTERVAL: ${XM_NEWAPI_SYNC_INTERVAL:-300s}
      XM_FINANCE_COLLECT_ENABLED: ${XM_FINANCE_COLLECT_ENABLED:-true}
      XM_FINANCE_COLLECT_INTERVAL: ${XM_FINANCE_COLLECT_INTERVAL:-300s}
      XM_RETENTION_ENABLED: ${XM_RETENTION_ENABLED:-true}
      XM_RETENTION_INTERVAL: ${XM_RETENTION_INTERVAL:-24h}
      # XM-0030c：审批单过期清理与队列观测。默认开——它是
      # approval.pending.too_long 告警规则的唯一输入，关掉等于那条规则失明。
      XM_APPROVAL_EXPIRE_ENABLED: ${XM_APPROVAL_EXPIRE_ENABLED:-true}
      XM_APPROVAL_EXPIRE_INTERVAL: ${XM_APPROVAL_EXPIRE_INTERVAL:-5m}
      XM_ALERT_EVALUATE_ENABLED: ${XM_ALERT_EVALUATE_ENABLED:-true}
      XM_ALERT_EVALUATE_INTERVAL: ${XM_ALERT_EVALUATE_INTERVAL:-60s}
      XM_CONNECTOR_PROBE_ENABLED: ${XM_CONNECTOR_PROBE_ENABLED:-true}
      XM_CONNECTOR_PROBE_INTERVAL: ${XM_CONNECTOR_PROBE_INTERVAL:-5m}
      # XM_REQLOG_MODE 已在上面「请求详情」小节透传，本节只补
      # reqlog_metrics 任务独有的周期变量。
      XM_REQLOG_METRICS_INTERVAL: ${XM_REQLOG_METRICS_INTERVAL:-5m}
      # XM_CPA_MODE 已在上面「CPA 逐 key 用量」小节透传，本节只补
      # cpa_sync 任务独有的启用开关与周期变量。
      XM_CPA_SYNC_ENABLED: ${XM_CPA_SYNC_ENABLED:-}
      XM_CPA_SYNC_INTERVAL: ${XM_CPA_SYNC_INTERVAL:-300s}
    volumes:
      # 命名卷而不是 bind：凭据文件只该存在于这个栈里，宿主目录一不小心就
      # 被 rsync / 备份脚本带走。镜像里已把挂载点交给运行用户（go.Dockerfile）。
      - xm-secrets:/run/xm/secrets
    # 不发布端口：admin-web 与 API 同源，一切经 web 服务进来（免 CORS）。
    # 需要直连调试时用 docker compose exec / 或同网络的一次性容器。
    healthcheck:
      # 运行镜像是 alpine，busybox wget 就够，不必为探针装 curl
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ==========================================================================
  # Platform Worker（River 队列）
  # ==========================================================================
  platform-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      target: platform-worker
      args:
        BUILD_VERSION: ${BUILD_VERSION:-staging}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: xingmang/platform-worker:${BUILD_VERSION:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgres://${POSTGRES_USER:-xingmang}@postgres:5432/${POSTGRES_DB:-xingmang}?sslmode=disable
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:-secret://database/postgres-password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-1m}
      # Sub2API 连接器模式。fake = 造数据，不连真实上游。
      # 切 real 需要下面四项一起配齐（XM-0017），缺任一项 worker 照常起，
      # 只是每轮同步往看板写一条 not_supported 的失败观测并说清缺哪个变量。
      # 切换步骤见 docs/modules/connector/RUNBOOK.md。
      XM_SUB2API_MODE: ${XM_SUB2API_MODE:-fake}
      XM_SUB2API_ENDPOINT: ${XM_SUB2API_ENDPOINT:-}
      XM_SUB2API_TARGET_ALLOWLIST: ${XM_SUB2API_TARGET_ALLOWLIST:-}
      XM_SUB2API_CREDENTIAL_REF: ${XM_SUB2API_CREDENTIAL_REF:-}
      # 只读账号的 API Token 明文。默认空：没配就是没有真实读取能力，
      # 而不是拿一个占位值去连上游（宪法 7 条：凭据只经 CredentialRef，
      # 这个变量只是 env Provider 的落点，Connector 并不认识它）。
      XM_SUB2API_TOKEN: ${XM_SUB2API_TOKEN:-}
      # --- NewAPI 连接器（XM-0035 契约 / XM-0038 真实客户端，规格 §8.4）------
      # fake = 造数据，不连真实上游。
      # 切 real 需要下面三项一起配齐（endpoint / allowlist / credential ref），
      # 缺任一项 worker 照常起，只是每轮同步往看板写一条 not_supported 的
      # 失败观测并说清缺哪个变量。
      # 切换步骤见 docs/runbooks/SWITCH-NEWAPI-REAL.md。
      #
      # ⚠️ 生产环境不接受 fake（会把演示数据写成运营读数）：要么配 real，
      #    要么显式 XM_NEWAPI_SYNC_ENABLED=false。配错了 worker 会**拒绝启动**。
      XM_NEWAPI_MODE: ${XM_NEWAPI_MODE:-fake}
      # --- Sub2API 同步(与 NewAPI 对称;真实模式由 core.connector_config 决定,此处为兜底默认) ---
      XM_SUB2API_SYNC_ENABLED: ${XM_SUB2API_SYNC_ENABLED:-true}
      XM_SUB2API_SYNC_INTERVAL: ${XM_SUB2API_SYNC_INTERVAL:-300s}
      XM_SUB2API_INSTANCE_ID: ${XM_SUB2API_INSTANCE_ID:-sub2api-staging}
      XM_NEWAPI_SYNC_ENABLED: ${XM_NEWAPI_SYNC_ENABLED:-true}
      XM_NEWAPI_SYNC_INTERVAL: ${XM_NEWAPI_SYNC_INTERVAL:-300s}
      # 观测的 Source，会原样显示在看板上。默认带 -staging 后缀：
      # 前端的演示横幅按这个字符串整串相等匹配，改了要同步改前端。
      XM_NEWAPI_INSTANCE_ID: ${XM_NEWAPI_INSTANCE_ID:-newapi-staging}
      XM_NEWAPI_ENDPOINT: ${XM_NEWAPI_ENDPOINT:-}
      XM_NEWAPI_TARGET_ALLOWLIST: ${XM_NEWAPI_TARGET_ALLOWLIST:-}
      XM_NEWAPI_CREDENTIAL_REF: ${XM_NEWAPI_CREDENTIAL_REF:-}
      # 管理员 access token 明文。默认空：没配就是没有真实读取能力，
      # 而不是拿一个占位值去连上游（宪法 7 条：凭据只经 CredentialRef，
      # 这个变量只是 env Provider 的落点，Connector 并不认识它）。
      # ⚠️ NewAPI 上游**没有只读角色**，这把 token 是全权限的——平台侧靠
      #    四道只读闸 + 写端点黑名单机械保证碰不到写路径，见操作卡的风险说明。
      XM_NEWAPI_TOKEN: ${XM_NEWAPI_TOKEN:-}
      # 可选：旧版本 NewAPI 要求的 New-Api-User 头（管理员的用户 id）。
      # 新版本上游已经不读它，留空即可；只有连老实例返 401 时才需要填。
      XM_NEWAPI_USER_ID: ${XM_NEWAPI_USER_ID:-}
      # --- NewAPI 收入只读直查（XM-0044，设计稿 §3.2）------------------------
      # 利润台账的**收入侧**走的是只读 DSN，不是上面那条 HTTP 通道：
      # 上游的 HTTP 面答不出「某个渠道今天赚了多少」，而 quota_data 表里
      # channel_id 与 quota 都有，一条 SUM 就够。
      #
      # 没配 = 收入侧写 NULL（未知），**不是 0**——把未知写成 0 会让毛利
      # 凭空等于成本的负数。配置步骤与建只读角色的 SQL 见
      # docs/runbooks/SWITCH-NEWAPI-REAL.md 的「收入只读直查」一节。
      #
      # ⚠️ 连接串里**不许带密码**（?password= 也不行）：pgx 会把 query 当连接
      #    设置读并覆盖 DSN 的表面声明，那是真实的绕过口子。口令只经 CredentialRef。
      XM_NEWAPI_REVENUE_DSN: ${XM_NEWAPI_REVENUE_DSN:-}
      XM_NEWAPI_REVENUE_PASSWORD_REF: ${XM_NEWAPI_REVENUE_PASSWORD_REF:-}
      XM_NEWAPI_REVENUE_PASSWORD: ${XM_NEWAPI_REVENUE_PASSWORD:-}
      # --- 连接器健康探测（XM-OPS0）-----------------------------------------
      # 对当前生效的 sub2api / newapi 连接器调用 Version() 与 Health()，
      # 写观测供运行保障页的「控制平面健康」子页展示。与 Sub2API/NewAPI
      # 同步同一条纪律：_ENABLED 是停用开关（宪法 26 条），_INTERVAL 是节奏，
      # 两者都可选，不配就用 5 分钟默认值。生产环境下探测 fake 模式的连接器
      # 会被启动闸拦下（详见 internal/platform/jobs/connector_probe.go）。
      XM_CONNECTOR_PROBE_ENABLED: ${XM_CONNECTOR_PROBE_ENABLED:-true}
      XM_CONNECTOR_PROBE_INTERVAL: ${XM_CONNECTOR_PROBE_INTERVAL:-5m}
      # --- 成本采集（XM-0037b / XM-REAL0-a）-------------------------------
      # 账号与令牌 CredentialRef 来自登记簿，SecretProvider 在每次读取时按
      # 引用解析；不在 Compose 中预声明动态 secret。provider 留空时 real
      # 成本链路如实记 not_supported，不影响 worker 心跳。
      XM_FINANCE_COLLECT_MODE: ${XM_FINANCE_COLLECT_MODE:-fake}
      XM_FINANCE_COLLECT_ENABLED: ${XM_FINANCE_COLLECT_ENABLED:-true}
      XM_FINANCE_COLLECT_INTERVAL: ${XM_FINANCE_COLLECT_INTERVAL:-300s}
      XM_FINANCE_COLLECT_INSTANCE_ID: ${XM_FINANCE_COLLECT_INSTANCE_ID:-finance-collect-staging}
      XM_FINANCE_COLLECT_TARGET_ALLOWLIST: ${XM_FINANCE_COLLECT_TARGET_ALLOWLIST:-}
      XM_FINANCE_COLLECT_REQUEST_TIMEOUT: ${XM_FINANCE_COLLECT_REQUEST_TIMEOUT:-10s}
      XM_FINANCE_COLLECT_SECRET_PROVIDER: ${XM_FINANCE_COLLECT_SECRET_PROVIDER:-}
      XM_FINANCE_COLLECT_SECRET_ROOT: ${XM_FINANCE_COLLECT_SECRET_ROOT:-/run/xm/finance-secrets}
      XM_FINANCE_COLLECT_SECRET_SCOPES: ${XM_FINANCE_COLLECT_SECRET_SCOPES:-}
      # --- 保留期清理（XM-R012）---------------------------------------------
      # ops.metric_observation_sample 以 5 分钟粒度追加（约 288 条/日/指标），
      # 在此之前没有任何清理路径。默认开启：一张没有清理路径的追加表迟早会
      # 成为运维事故。关掉它是一个显式的停用动作（宪法 26 条）。
      #
      # ⚠️ 审计事件**不在清理范围内**，因此这里没有「审计保留天数」这个变量。
      #    审计链 append-only（宪法 11 条），删中间任意一条都会断链，而且
      #    audit.audit_event 上的 DO INSTEAD NOTHING 规则让 DELETE 静默空转。
      #    理由完整写在 internal/platform/jobs/retention.go 的文件头。
      #    审计的容量问题走归档（导出 + 链根锚定后转冷存储），是另一件事。
      #
      # 天数填 0 或负数会让 worker **拒绝启动**：0 天最自然的读法是「不保留」，
      # 也就是把整张表删空，而想表达「不清理」的人该来关上面那个开关。
      XM_RETENTION_ENABLED: ${XM_RETENTION_ENABLED:-true}
      XM_RETENTION_INTERVAL: ${XM_RETENTION_INTERVAL:-24h}
      # XM-0030c：审批单过期清理与队列观测。默认开——它是
      # approval.pending.too_long 告警规则的唯一输入，关掉等于那条规则失明。
      XM_APPROVAL_EXPIRE_ENABLED: ${XM_APPROVAL_EXPIRE_ENABLED:-true}
      XM_APPROVAL_EXPIRE_INTERVAL: ${XM_APPROVAL_EXPIRE_INTERVAL:-5m}
      XM_METRIC_SAMPLE_RETENTION_DAYS: ${XM_METRIC_SAMPLE_RETENTION_DAYS:-90}
      XM_ALERT_RETENTION_DAYS: ${XM_ALERT_RETENTION_DAYS:-180}
      # --- 告警中心（XM-0033，规格 §9.3 / §9.4）-----------------------------
      # 与 Sub2API 那几项相反：告警渠道**配错就让进程起不来**（ref 拼错、
      # URL 不是 https、只配了一半）。理由见 docs/modules/alerts/README.md——
      # 一个没建起来的告警渠道不会有任何后续痕迹，只会在真出事那天才被发现。
      # 三个都不配是允许的：告警照常评估落库，每轮打一条「仅落库未投递」。
      XM_ALERT_EVALUATE_ENABLED: ${XM_ALERT_EVALUATE_ENABLED:-true}
      XM_ALERT_EVALUATE_INTERVAL: ${XM_ALERT_EVALUATE_INTERVAL:-60s}
      XM_ALERT_TELEGRAM_BOT_REF: ${XM_ALERT_TELEGRAM_BOT_REF:-}
      XM_ALERT_TELEGRAM_CHAT_ID: ${XM_ALERT_TELEGRAM_CHAT_ID:-}
      # Bot Token 明文，是上面那个 ref 在 env Provider 下的落点。
      # ⚠️ 这个 Bot 只服务平台内部告警。外部看门狗必须用**另一个** Bot
      #    （规格 §9.4 红线，见 deploy/watchdog/README.md）。
      XM_ALERT_TELEGRAM_TOKEN: ${XM_ALERT_TELEGRAM_TOKEN:-}
      XM_ALERT_WEBHOOK_URL: ${XM_ALERT_WEBHOOK_URL:-}
      # 企业微信群机器人（XM-ALERT-WECOM）。与上面两条不同：**整个地址就是
      # 凭据**，经 CredentialRef 解析、走文件优先链（XM-CRED0）——运营可以
      # 在后台「设置→凭据」页直接粘贴，不需要经过这份 .env。
      # XM_ALERT_WECOM_WEBHOOK 是该引用在 env Provider 下的落点，仅在还没
      # 在后台填过时兜底；只填在不入库的 .env 里。
      XM_ALERT_WECOM_WEBHOOK_REF: ${XM_ALERT_WECOM_WEBHOOK_REF:-}
      XM_ALERT_WECOM_WEBHOOK: ${XM_ALERT_WECOM_WEBHOOK:-}
      XM_ALERT_BALANCE_THRESHOLD_MINOR_UNITS: ${XM_ALERT_BALANCE_THRESHOLD_MINOR_UNITS:-500000}
      # 被动保障探测（ADR-019）。**必须与 platform-api 段配同一个值**：
      # 两个进程互不可见对方内存，各自独立解析这两个变量——Action 接受时读的是
      # api 侧的值，Job 执行时刻复检读的是 worker 侧的值。配不一致的症状是
      # 「Action 收下了，作业却拒绝执行」，而两边日志各自看都正常。
      XM_ASSURE_PROBE_ENABLED: ${XM_ASSURE_PROBE_ENABLED:-}
      XM_ASSURE_PROBE_DAILY_BUDGET: ${XM_ASSURE_PROBE_DAILY_BUDGET:-}
      # --- 请求量/成功率聚合（XM-REQLOG-METRICS）----------------------------
      # 与 platform-api 共享同一个环境变量名 XM_REQLOG_MODE/XM_REQLOG_DATA_DIR
      # （见该服务的「请求详情 / reqlog 只读网关」小节）：两个进程只读同一份
      # 记录代理落盘数据，但 worker 侧只认得出 off/file 两档——fake/real 是
      # platform-api「请求详情」链路独有的模式，worker 遇到会退化成 off 并
      # warn，不影响启动。off（默认）不注册这条聚合任务，看板对应三张卡片
      # 按缺观测显示「未接入」；file 时从下面的目录聚合，只读，不解压正文。
      XM_REQLOG_MODE: ${XM_REQLOG_MODE:-off}
      # 容器内路径，与下方 platform-api 的默认值一致；只在 XM_REQLOG_MODE=file
      # 时用到。宿主机路径挂载见 deploy/compose/server-prod.yaml。
      XM_REQLOG_DATA_DIR: ${XM_REQLOG_DATA_DIR:-}
      XM_REQLOG_METRICS_INTERVAL: ${XM_REQLOG_METRICS_INTERVAL:-5m}

      # --- CPA 周期同步（cpa_sync，XM-CPA0）---------------------------------
      # CPA = CLI Proxy API + cpa-manager-plus，只读文件后端直读宿主机
      # usage.sqlite（只读绑定挂载，从不挂载 auths/config.yaml 等含凭据文件）。
      # 没有 fake 模式：off 是唯一安全的默认——一个没配 XM_CPA_MODE 的环境
      # 应当保持关闭，而不是每轮同步都对着不存在的挂载路径报错。
      # 切 file 需要 XM_CPA_DATA_DIR 指向容器内的只读挂载目录；本 staging
      # 基线不挂对应宿主目录，切换时须另加明确覆盖，且不得挂
      # auths/config.yaml 等凭据文件。
      XM_CPA_MODE: ${XM_CPA_MODE:-off}
      XM_CPA_DATA_DIR: ${XM_CPA_DATA_DIR:-}
      XM_CPA_FILE_NAME: ${XM_CPA_FILE_NAME:-}
      # XM_CPA_SYNC_ENABLED 留空时跟随 XM_CPA_MODE（file 打开、off 关闭）；
      # 显式 false 可以在 file 模式下临时按下暂停键（宪法 26 条），但不能用
      # 它在 off 模式下把同步打开——那种矛盾配置会被 worker 拒绝启动。
      XM_CPA_SYNC_ENABLED: ${XM_CPA_SYNC_ENABLED:-}
      XM_CPA_SYNC_INTERVAL: ${XM_CPA_SYNC_INTERVAL:-300s}
      # 卡片同步（XM-CARD2）：承担异步开卡的轮询与不确定态的对账收敛。
      # XM_CARDS_* 与 API 段同值——两个进程必须解析出**同一组账号**，
      # 否则会出现「API 能开卡的账号，worker 不认识」，那笔操作的不确定态
      # 永远收敛不了。worker 不发起花钱操作，所以不读金额上限。
      XM_CARDS_MODE: ${XM_CARDS_MODE:-off}
      XM_CARDS_BASE_URL: ${XM_CARDS_BASE_URL:-}
      XM_CARDS_ACCOUNTS: ${XM_CARDS_ACCOUNTS:-}
      # 不确定态的宽限期：期内查不到就继续等，超期才亮红条要人工。
      # 留空用 30 分钟——更短会把「上游慢了一点」变成一次不必要的人工介入。
      XM_CARDS_UNKNOWN_GRACE: ${XM_CARDS_UNKNOWN_GRACE:-}
      # 流水同步（XM-CARD6 起**默认开启**，留空即开）。
      #
      # 原先默认关闭的理由是「调用量与卡数成正比，而上游限流阈值未知」。
      # 那个未知已在 2026-09-05 实测掉：600 次/分钟/密钥。按 250 张卡、
      # 5 分钟一轮是 50 次/分钟（8%），而卡状态刷新同期改成了批量
      # （250 张卡从 250 次降到 3 次），恰好把它占掉的预算让了出来。
      # 回调已能秒级推进单卡流水，这一轮周期同步是兜底——兜底默认开着
      # 才有意义。只有显式的 false 才关闭。
      XM_CARDS_SYNC_TRANSACTIONS: ${XM_CARDS_SYNC_TRANSACTIONS:-}
      # 接码巡检（XM-SMS2 #7）：只读的连接测试 + 余额快照，一分钱都不花。
      # XM_SMS_MODE 与 API 段同值——两个进程必须认识**同一组供应商**，
      # 否则「API 能买号、worker 不认识这家」，那家的余额永远没有数据。
      # off 时 worker 根本不注册这个任务。
      XM_SMS_MODE: ${XM_SMS_MODE:-off}
      # 巡检节奏，留空用 10 分钟：余额与凭据状态都不是每分钟在变的量，
      # 而每轮会给每家各打两个上游请求。
      XM_SMS_PROBE_INTERVAL: ${XM_SMS_PROBE_INTERVAL:-}
      XM_CPA_INSTANCE_ID: ${XM_CPA_INSTANCE_ID:-cpa-cli-proxy-api}
      # --- 凭据登记（XM-CRED0）--------------------------------------------
      # 与 platform-api 同一个卷、同一个根目录；worker 只读——它经
      # secrets.NewFileProvider 按 core.connector_config 里的引用读值，
      # 没有任何写路径。
      XM_SECRET_ROOT: ${XM_SECRET_ROOT:-/run/xm/secrets}
    volumes:
      - xm-secrets:/run/xm/secrets:ro

  # ==========================================================================
  # Web（admin-web 静态产物 + /api/ 反代）
  # ==========================================================================
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: web
    image: xingmang/web:${BUILD_VERSION:-staging}
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_healthy
    environment:
      # 前端鉴权方式（XM-AUTH1）。容器启动时 deploy/docker/web-app-config.sh 把这
      # 三项写进 /app-config.js，浏览器端按它决定发开发头还是 Bearer 令牌。
      # 默认 dev-header 与上面 platform-api 的默认一致。两边要**同时**切：
      # 只切前端 → 后端不认 Bearer（403 缺少身份）；只切后端 → 前端还在发开发头。
      # issuer / client id 留空时回落到后端的 XM_OIDC_ISSUER / XM_OIDC_AUDIENCE，
      # 因为它们本来就必须相同（issuer 逐字比对，client id 就是后端校验的 aud/azp）。
      XM_WEB_AUTH_MODE: ${XM_WEB_AUTH_MODE:-dev-header}
      XM_WEB_OIDC_ISSUER: ${XM_WEB_OIDC_ISSUER:-${XM_OIDC_ISSUER:-}}
      XM_WEB_OIDC_CLIENT_ID: ${XM_WEB_OIDC_CLIENT_ID:-${XM_OIDC_AUDIENCE:-}}
      # 开票控制台嵌入来源（CR-0005 平台线 i）。静态直传，同 reqlog/CPA 先例——
      # 不是上面 auth 那种要互相校验的模式开关。留空时 Sub2API/NewAPI「支付与
      # 财务 → 开票」与治理「跨平台财务 → 开票集成」三处都显示未配置，不渲染
      # iframe；不会猜一个默认地址——开票系统部署在哪不是这个仓库该硬编码的事。
      XM_INVOICE_CONSOLE_ORIGIN: ${XM_INVOICE_CONSOLE_ORIGIN:-}
    ports:
      # 这个发布口是给**服务器部署**用的。本开发机的宿主→容器端口转发被
      # 代理 TUN 劫持（SYN 停滞），从宿主浏览器访问多半不通——不是栈的问题，
      # 验证方式见 docs/runbooks/LAUNCH.md「已知问题」。
      # 默认绑 127.0.0.1：要对外提供服务时显式改 WEB_BIND，
      # 别让一个默认值把管理后台开到公网上。
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/index.html >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres18-data:
  # 运营粘贴的上游凭据文件（XM-CRED0）。api 读写、worker 只读。
  # 换机器时它和 postgres18-data 一样要一起迁：DB 里只有指纹，没有值。
  xm-secrets:

secrets:
  # 从 deploy/compose/.env 的 DATABASE_PASSWORD 读取。
  # 真实 .env 不入库（.gitignore 已挡），仓库里只有 .env.example。
  database__postgres_password:
    environment: DATABASE_PASSWORD

name: xingmang-platform-dev

# Local-only PostgreSQL for development and integration tests. The password is
# supplied through a Compose secret backed by POSTGRES_DEV_PASSWORD; no secret
# value is stored in this file or in the repository.
services:
  postgres:
    image: docker.io/library/postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    # VERSIONS.lock records the amd64 manifest; pin the local Mac run to it.
    platform: linux/amd64
    environment:
      POSTGRES_DB: xingmang
      POSTGRES_USER: xingmang
      POSTGRES_PASSWORD_FILE: /run/secrets/database__postgres_password
    secrets:
      - source: database__postgres_password
        target: database__postgres_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 stores the cluster below a major-version directory.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres18-data:

# Compose reads the value from the developer's environment and mounts it as a
# Docker secret. Set POSTGRES_DEV_PASSWORD outside the repository before
# starting this file, for example:
#   POSTGRES_DEV_PASSWORD='(local value)' docker compose -f deploy/compose/dev.yaml up -d --wait
secrets:
  database__postgres_password:
    environment: POSTGRES_DEV_PASSWORD

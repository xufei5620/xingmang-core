        created_at:
          type: integer
          format: int64
          description: Withdrawal creation time, as a Unix timestamp in seconds.
          example: 1787564636
        status:
          type: string
          description: Current withdrawal status.
          enum:
            - pending
            - processing
            - completed
            - failed
          example: completed
        amount:
          type: string
          description: Total amount deducted from the source account.
          example: '11'
        fee:
          type: string
          description: >-
            Legacy Gas fee field. New integrations should use `gas_fee` and
            `gas_fee_currency`.
          example: '0.1'
        actual_amount:
          type: string
          description: Actual amount sent on-chain in `token_type`.
          example: '10.9'
        transaction_hash:
          type: string
          description: On-chain transaction hash. Empty before submission.

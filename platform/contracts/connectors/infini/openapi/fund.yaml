          type: string
          description: Public chain name.
          example: ETHEREUM
        token_type:
          type: string
          description: Token type sent on-chain.
          example: USDT
        source_currency:
          type: string
          description: Source account currency.
          example: USDT
        gas_fee:
          type: string
          description: Customer-facing Gas fee charged for the withdrawal.

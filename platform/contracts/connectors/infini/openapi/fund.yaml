    ListWithdrawStatusesResponse:
      type: object
      required:
        - withdrawals
        - total
        - page
        - page_size
        - total_pages
      properties:
        withdrawals:
          type: array
          description: Matching withdrawal statuses ordered by creation time descending.
          items:
            $ref: '#/components/schemas/WithdrawalStatusListItem'
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of withdrawals matching the time range.
          example: 1
        page:
          type: integer
          minimum: 1
          description: Current page number.
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of withdrawals requested per page.
          example: 20
        total_pages:
          type: integer
          minimum: 0
          description: Total number of pages. Zero when no withdrawals match.

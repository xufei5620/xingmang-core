<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星芒 · 本地开发进度</title>
    <style>
      :root { color-scheme: light; --bg:#f4f7fb; --surface:#fff; --ink:#172033; --muted:#667085; --line:#dbe3ef; --accent:#315efb; --accent-soft:#edf2ff; --good:#13795b; --good-soft:#e9f8f1; --warn:#a16207; --warn-soft:#fff6db; --danger:#b42318; --danger-soft:#fff0ee; --shadow:0 14px 40px rgba(31,52,92,.08); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% -10%, #e7eeff 0, transparent 38%), var(--bg); color:var(--ink); }
      main { width:min(1180px, calc(100% - 32px)); margin:0 auto; padding:28px 0 44px; }
      header { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; margin-bottom:22px; }
      .eyebrow { margin:0 0 6px; color:var(--accent); font-size:12px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(24px, 4vw, 38px); letter-spacing:-.03em; }
      .subtitle { margin:8px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
      .live { display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.8); color:var(--muted); font-size:12px; white-space:nowrap; }
      .live i { width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 4px var(--good-soft); }
      .live.stale i { background:var(--warn); box-shadow:0 0 0 4px var(--warn-soft); }
      .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
      .card { min-width:0; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow); }
      .hero { grid-column:span 8; background:linear-gradient(135deg, #fff 0%, #f1f5ff 100%); }
      .meta { grid-column:span 4; }
      .wide { grid-column:span 7; }
      .side { grid-column:span 5; }
      .full { grid-column:1/-1; }
      .label { color:var(--muted); font-size:12px; }
      .value { margin-top:7px; font-size:22px; font-weight:760; letter-spacing:-.02em; }
      .phase { display:flex; align-items:center; gap:12px; }
      .phase-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; color:var(--accent); background:var(--accent-soft); font-size:20px; }
      .status { display:inline-flex; margin-top:12px; padding:4px 9px; border-radius:999px; color:var(--good); background:var(--good-soft); font-size:12px; font-weight:700; }
      .status.warn { color:var(--warn); background:var(--warn-soft); }
      .status.danger { color:var(--danger); background:var(--danger-soft); }
      h2 { margin:0 0 12px; font-size:15px; }
      dl { display:grid; grid-template-columns:auto 1fr; gap:9px 16px; margin:0; font-size:13px; }
      dt { color:var(--muted); }
      dd { min-width:0; margin:0; overflow-wrap:anywhere; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
      .progress { height:9px; margin:14px 0 7px; overflow:hidden; border-radius:999px; background:#e9eef7; }
      .progress span { display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg, #315efb, #7c5cff); transition:width .35s ease; }
      .progress-row { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
      .timeline { display:flex; flex-direction:column; gap:11px; margin:0; padding:0; list-style:none; }
      .timeline li { display:grid; grid-template-columns:12px 1fr auto; gap:10px; align-items:start; font-size:13px; }
      .dot { width:9px; height:9px; margin-top:4px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
      .timeline strong { display:block; font-weight:650; }
      .timeline small { display:block; margin-top:3px; color:var(--muted); line-height:1.45; }
      .time { color:var(--muted); font-size:11px; white-space:nowrap; }
      .files { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:8px; margin:0; padding:0; list-style:none; }
      .files li { min-width:0; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fbfcfe; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; overflow-wrap:anywhere; }
      .empty { color:var(--muted); font-size:13px; }
      footer { margin-top:16px; color:var(--muted); font-size:11px; text-align:center; }
      @media (max-width:800px) { main { width:min(100% - 20px, 620px); padding-top:18px; } header { flex-direction:column; } .hero,.meta,.wide,.side { grid-column:1/-1; } .card { padding:15px; border-radius:13px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">XINGMANG / LOCAL LOOP</p><h1>本地开发进度</h1><p class="subtitle">查看当前切片、最近变更与验证结果。此页只读取本地进度文件，不连接生产或第三方平台。</p></div>
        <div id="live" class="live"><i></i><span>正在连接进度源…</span></div>
      </header>
      <div class="grid">
        <section class="card hero"><div class="phase"><div class="phase-mark">✦</div><div><div class="label">当前阶段</div><div id="phase" class="value">加载中…</div></div></div><div id="status" class="status">读取中</div><div class="progress"><span id="progressBar"></span></div><div class="progress-row"><span id="progressLabel">等待进度文件</span><span id="updatedAt">—</span></div></section>
        <section class="card meta"><h2>工作树</h2><dl><dt>分支</dt><dd id="branch">—</dd><dt>HEAD</dt><dd id="head">—</dd><dt>本地提交</dt><dd id="commits">—</dd><dt>模式</dt><dd id="mode">local-only</dd></dl></section>
        <section class="card wide"><h2>验证状态</h2><dl><dt>后端</dt><dd id="backend">—</dd><dt>前端</dt><dd id="frontend">—</dd><dt>Storybook</dt><dd id="storybook">—</dd><dt>治理门禁</dt><dd id="governance">—</dd></dl></section>
        <section class="card side"><h2>下一步</h2><p id="next" class="empty">—</p></section>
        <section class="card full"><h2>最近变更</h2><ul id="timeline" class="timeline"><li><span class="dot"></span><div><strong>等待进度源</strong><small>启动后会在这里显示提交和切片变化。</small></div><span class="time">—</span></li></ul></section>
        <section class="card full"><h2>变更文件</h2><ul id="files" class="files"><li class="empty">暂无记录</li></ul></section>
      </div>
      <footer>自动刷新间隔 1.5 秒 · 页面可以长期开着作为本地监控面</footer>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const fmtTime = (value) => { if (!value) return "—"; const d = new Date(value); return Number.isNaN(d.getTime()) ? value : d.toLocaleString("zh-CN", { hour12:false }); };
      const text = (id, value) => { $(id).textContent = value ?? "—"; };
      function render(data) {
        text("phase", data.phase || "未设置");
        text("branch", data.branch || "—"); text("head", data.head || "—"); text("commits", data.commits ?? "—");
        text("backend", data.checks?.backend || "未运行"); text("frontend", data.checks?.frontend || "未运行"); text("storybook", data.checks?.storybook || "未运行"); text("governance", data.checks?.governance || "未运行");
        text("next", data.next || "暂无下一步"); text("updatedAt", fmtTime(data.updatedAt));
        const pct = Math.max(0, Math.min(100, Number(data.progress ?? 0))); $("progressBar").style.width = `${pct}%`; text("progressLabel", `${pct}% · ${data.progressLabel || "持续推进中"}`);
        const status = $("status"); status.textContent = data.statusLabel || data.status || "进行中"; status.className = `status ${data.statusTone || ""}`;
        const timeline = $("timeline"); timeline.replaceChildren();
        for (const item of (data.timeline || []).slice(0, 8)) { const li = document.createElement("li"); li.innerHTML = `<span class="dot"></span><div><strong></strong><small></small></div><span class="time"></span>`; li.querySelector("strong").textContent = item.title || "变更"; li.querySelector("small").textContent = item.detail || ""; li.querySelector(".time").textContent = fmtTime(item.at); timeline.appendChild(li); }
        if (!timeline.children.length) { const li = document.createElement("li"); li.innerHTML = `<span class="dot"></span><div><strong>暂无变更</strong><small>等待下一次本地进度更新。</small></div><span class="time">—</span>`; timeline.appendChild(li); }
        const files = $("files"); files.replaceChildren(); const changed = data.changedFiles || []; for (const file of changed.slice(0, 24)) { const li = document.createElement("li"); li.textContent = file; files.appendChild(li); } if (!changed.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "暂无未提交文件"; files.appendChild(li); }
      }
      let lastGood = 0;
      async function refresh() { try { const response = await fetch(`progress.json?ts=${Date.now()}`, { cache:"no-store" }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const data = await response.json(); render(data); lastGood = Date.now(); $("live").className = "live"; $("live span").textContent = `实时 · ${fmtTime(data.updatedAt)}`; } catch (error) { $("live").className = "live stale"; $("live span").textContent = lastGood ? "进度源暂时不可用" : "等待进度源…"; } }
      refresh(); setInterval(refresh, 1500);
    </script>
  </body>
</html>

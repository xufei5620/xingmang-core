version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/registry.sql"
    gen:
      go:
        package: "gen"
        out: "internal/platform/registry/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.UUID"

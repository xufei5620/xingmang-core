openapi: 3.0.0
info:
  title: Infini Acquiring API
  version: 1.0.0
  description: >-
    Hosted checkout APIs for orders, payments, and subscriptions. All endpoints
    use the `/v1/acquiring` prefix.


    Requests require [HMAC-SHA256 authentication](/docs/en/4-authorization). To
    use **Try it**, save Sandbox credentials on [API Credentials](/credentials),
    or enter Key and Secret under **Security → HMAC**.
servers:
  - url: https://openapi.infini.money/v1/acquiring
    description: Production
  - url: https://openapi-sandbox.infini.money/v1/acquiring
    description: Sandbox
tags:
  - name: Currency
    description: Supported payment chains and tokens
  - name: Order
    description: Create and query orders, reissue checkout tokens
  - name: Payment
    description: Advanced payment APIs (optional for hosted checkout)
  - name: Subscription
    description: Subscription billing
paths:
  /currency:
    get:
      operationId: getSupportedCurrencies
      summary: List supported payment currencies
      description: >-
        Returns the supported blockchain and token combinations available for
        acquiring payments.
      tags:
        - Currency
      parameters:
        - name: Date
          in: header
          required: false
          description: >-
            GMT server time (e.g. Tue, 21 Jan 2025 12:00:00 GMT). Required for
            every request.
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: >-
            HMAC-SHA256 `Signature` header. See the
            [Authentication](/docs/en/4-authorization) guide.
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com.infini-money.infini-services-go.app.infini-payment-service.api.currency.v1.GetSupportCurrencyRes
          description: Supported chain and token combinations
      x-codeSamples:
        - lang: curl
          label: cURL (HMAC)
          source: |-
            curl -i -X GET \
              '{{INFINI_BASE_URL}}/currency' \
              -H 'Date: <GMT date>' \
              -H 'Authorization: Signature keyId="{{INFINI_KEY_ID}}",algorithm="hmac-sha256",headers="@request-target date",signature="<signature>"'
        - lang: Go
          label: Go (HMAC)
          source: |-
            // Signing string: {keyId}\n{METHOD} {path}\ndate: {GMT}\n
            keyID := "{{INFINI_KEY_ID}}"
            secretKey := "{{INFINI_SECRET}}"
            path := "/v1/acquiring/currency"
            method := "GET"
  /order:
    get:
      parameters:
        - description: Order id

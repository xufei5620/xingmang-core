        bank_reference:
          type: string
          nullable: true
          description: 可用时返回银行汇款引用。
          example: RMTO2084957259539812352
        failure:
          $ref: '#/components/schemas/Failure'
        return:
          $ref: '#/components/schemas/PayoutReturn'

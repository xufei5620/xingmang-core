openapi: 3.0.0
info:
  title: Infini 法币付款 API
  version: 0.4.0
  description: >-
    法币付款 API 支持组织从 Infini USD 余额向第三方银行账户进行 USD 付款报价、创建和查询。


    所有接口均使用 `/v2/payouts` 前缀。请求必须通过 [HMAC-SHA256
    鉴权](/docs/en/4-authorization)，并使用具有相应付款权限的 API Key。


    `POST /v2/payouts` 不进入后台审批流。Infini
    会完成最终的权限、合规、Quote、收款资料、限额及可用余额校验，然后立即开始执行付款。银行结算是异步过程，因此创建成功通常返回
    `status=processing`；这不代表收款银行账户已经到账。
servers:
  - url: https://openapi.infini.money
    description: 生产环境
  - url: https://openapi-sandbox.infini.money
    description: 沙箱环境
tags:
  - name: 报价
    description: 有时效性的付款定价与收款资料校验
  - name: 付款
    description: 直接执行法币付款并查询状态
paths:
  /v2/payouts/quotes:
    post:
      operationId: createFiatPayoutQuote
      summary: 创建付款报价
      description: >-
        校验一份银行收款资料，并返回有时效性的付款 Quote。需要 `payout.write` 权限。


        第一期不提供独立的收款人资源，因此收款资料直接随 Quote 提交。Infini 会将标准化且不可变的收款资料快照绑定到
        `quote_id`；创建付款时不能替换或修改这份资料。


        第一期只支持以下金额模式与手续费承担方组合：


        - `amount_mode=send` 与 `fee_paid_by=BENEFICIARY`：手续费内扣。`amount` 固定
        `sending_amount`；`transfer_fee_amount = sending_amount ×
        fee_rate_decimal`；`receiving_amount = sending_amount -
        transfer_fee_amount - bank_fee_amount`。当 `amount=1000.00`、费率为
        `0.001`、银行费为 `50.00` 时，收款人到账 `949.00`。

        - `amount_mode=receive` 与 `fee_paid_by=PAYER`：手续费外扣。`amount` 固定
        `receiving_amount`；`transfer_fee_amount = sending_amount ×
        fee_rate_decimal`；`sending_amount = receiving_amount +
        transfer_fee_amount + bank_fee_amount`。当 `amount=1000.00`、费率为
        `0.001`、银行费为 `50.00` 时，付款账户扣款 `1051.05`。


        在 `receive` 模式下，Infini 会反算并增加 `sending_amount`，确保扣除全部手续费后收款金额仍然准确。


        修改 `fee_paid_by` 会改变计算结果，因此必须重新请求 Quote。已接受的 `quote_id` 会固定 Payout
        使用的手续费承担方和两侧金额。


        Quote 阶段会执行初步的收款资料、路由、金额、合规和限额校验，但不会冻结余额、批准或创建付款，也不保证一定能够执行。`POST
        /v2/payouts` 会根据当时状态重新执行所有关键校验。
      tags:
        - 报价
      parameters:
        - $ref: '#/components/parameters/DateHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/DigestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
            example:
              amount: '1000.00'
              amount_mode: receive
              fee_paid_by: PAYER
              source_currency: USD
              destination_currency: USD
              destination_country: US
              payout_type: swift
              destination:
                type: bank_account
                account_holder_type: business
                account_holder_name: Acme Supplies LLC
                bank_country: US
                bank_name: Example Bank
                account_number: '9876543210'
                swift_code: BOFAUS3NXXX
                address:
                  line1: 123 Market Street
                  line2: Suite 500
                  city: New York
                  state: NY
                  postal_code: '10001'
                  country: US
      responses:
        '200':
          description: 有时效性的付款 Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteEnvelope'
              example:
                code: 0
                message: ''
                data:
                  quote_id: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
                  provider: sgb
                  payout_type: swift
                  source_currency: USD
                  destination_currency: USD
                  destination_country: US
                  amount_mode: receive
                  fee_paid_by: PAYER
                  sending_amount: '1051.05'
                  receiving_amount: '1000.00'
                  transfer_fee_amount: '1.05'
                  bank_fee_amount: '50.00'
                  fee_rate_decimal: '0.001'
                  rate: '1'
                  billing:
                    currency: USD
                    transfer_fee: '1.05'
                    fx_fee: '0.00'
                    rail_fee: '50.00'
                    total_fee: '51.05'
                    fee_lines:
                      - type: transfer_fee
                        amount: '1.05'
                        currency: USD
                        rate: '0.001'
                      - type: rail_fee
                        amount: '50.00'
                        currency: USD
                        rate: '1'
                  destination:
                    type: bank_account
                    account_holder_type: business
                    account_holder_name: Acme Supplies LLC
                    bank_country: US
                    bank_name: Example Bank
                    account_number_masked: '******3210'
                    swift_code: BOFAUS3NXXX
                  expires_at: 1786586700
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: curl
          label: cURL (HMAC)
          source: |-
            curl -i -X POST \
              '{{INFINI_BASE_URL}}/v2/payouts/quotes' \
              -H 'Content-Type: application/json' \
              -H 'Date: <GMT date>' \
              -H 'Digest: SHA-256=<base64(sha256(request body))>' \
              -H 'Authorization: Signature keyId="{{INFINI_KEY_ID}}",algorithm="hmac-sha256",headers="@request-target date",signature="<signature>"' \
              -d '{
                "amount": "1000.00",
                "amount_mode": "receive",
                "fee_paid_by": "PAYER",
                "source_currency": "USD",
                "destination_currency": "USD",
                "destination_country": "US",
                "payout_type": "swift",
                "destination": {
                  "type": "bank_account",
                  "account_holder_type": "business",
                  "account_holder_name": "Acme Supplies LLC",
                  "bank_country": "US",
                  "bank_name": "Example Bank",
                  "account_number": "9876543210",
                  "swift_code": "BOFAUS3NXXX",
                  "address": {
                    "line1": "123 Market Street",
                    "line2": "Suite 500",
                    "city": "New York",
                    "state": "NY",
                    "postal_code": "10001",
                    "country": "US"
                  }
                }
              }'
  /v2/payouts:
    post:
      operationId: createFiatPayout
      summary: 创建法币付款
      description: >-
        使用有效 Quote 创建付款并立即开始执行。需要 `payout.write` 权限，且付款不会进入后台审批流。


        `quote_id`
        已经绑定服务商、收款资料快照、来源和目标币种、付款通道、金额模式、手续费承担方、汇率、金额和费用明细，因此本请求不重复提交这些字段。


        本接口会执行具有最终效力的付款前校验，包括 API Key 归属与权限、Quote 归属与有效期、请求与 Quote
        一致性、账户和收款资料、合规控制、限额、可用余额、执行服务商可用性和幂等。


        `client_reference_id` 必须在当前鉴权组织内唯一标识一笔逻辑付款。使用相同业务请求重试时返回已有付款，并设置
        `is_duplicate=true`；使用相同值提交不同请求数据时返回冲突。


        请求成功表示付款已被接受并开始银行执行，不代表对端银行已经入账。请使用 `GET /v2/payouts/{payout_id}`
        获取最新状态。


        同一组织同一时间只允许一笔付款请求进入执行流程。并发提交会在消费 Quote、创建付款单和扣减余额之前返回 `108015
        payout_submission_in_progress`。请在短暂的随机退避后重试；同一笔逻辑付款应继续使用相同的
        `client_reference_id`。
      tags:
        - 付款
      parameters:
        - $ref: '#/components/parameters/DateHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/DigestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
            example:
              client_reference_id: payout_20260730_0001
              quote_id: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
              purpose_code: goods_and_services
              statement_reference: INV-2026-0730
      responses:
        '200':
          description: 付款创建成功，或返回幂等命中的已有付款
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutEnvelope'
              example:
                code: 0
                message: ''
                data:
                  payout_id: fpo_01JQ90GQJTC5P7B2D8N6R4K1MX
                  client_reference_id: payout_20260730_0001
                  quote_id: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
                  provider: sgb
                  status: processing
                  payout_type: swift
                  source_currency: USD
                  destination_currency: USD
                  destination_country: US
                  amount_mode: receive
                  fee_paid_by: PAYER
                  sending_amount: '1051.05'
                  receiving_amount: '1000.00'
                  transfer_fee_amount: '1.05'
                  bank_fee_amount: '50.00'
                  fee_rate_decimal: '0.001'
                  rate: '1'
                  billing:
                    currency: USD
                    transfer_fee: '1.05'
                    fx_fee: '0.00'
                    rail_fee: '50.00'
                    total_fee: '51.05'
                    fee_lines:
                      - type: transfer_fee
                        amount: '1.05'
                        currency: USD
                        rate: '0.001'
                      - type: rail_fee
                        amount: '50.00'
                        currency: USD
                        rate: '1'
                  destination:
                    type: bank_account
                    account_holder_type: business
                    account_holder_name: Acme Supplies LLC
                    bank_country: US
                    bank_name: Example Bank
                    account_number_masked: '******3210'
                    swift_code: BOFAUS3NXXX
                  purpose_code: goods_and_services
                  statement_reference: INV-2026-0730
                  bank_reference: null
                  failure: null
                  return: null
                  is_duplicate: false
                  created_at: 1786587000
                  updated_at: 1786587001
                  completed_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        - lang: curl
          label: cURL (HMAC)
          source: |-
            curl -i -X POST \
              '{{INFINI_BASE_URL}}/v2/payouts' \
              -H 'Content-Type: application/json' \
              -H 'Date: <GMT date>' \
              -H 'Digest: SHA-256=<base64(sha256(request body))>' \
              -H 'Authorization: Signature keyId="{{INFINI_KEY_ID}}",algorithm="hmac-sha256",headers="@request-target date",signature="<signature>"' \
              -d '{
                "client_reference_id": "payout_20260730_0001",
                "quote_id": "poq_01JQ90B8S5VJ6R3T7F1M2C4N9X",
                "purpose_code": "goods_and_services",
                "statement_reference": "INV-2026-0730"
              }'
  /v2/payouts/status/batch:
    post:
      operationId: batchGetFiatPayoutStatuses
      summary: 分页查询法币付款状态
      description: |-
        返回当前鉴权组织在 `start_time` 至 `end_time`（包含边界）内创建的法币付款。需要 `payout.read` 权限。

        结果按创建时间倒序排列并使用页码分页。`page` 默认值为 `1`；`page_size` 默认值为 `20`，最大值为 `100`。

        按时间窗口定期对账时使用此接口；查询一笔已知付款时使用 `GET /v2/payouts/{payout_id}`。
      tags:
        - 付款
      parameters:
        - $ref: '#/components/parameters/DateHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/DigestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPayoutStatusRequest'
            example:
              start_time: 1786500000
              end_time: 1786599999
              page: 1
              page_size: 20
      responses:
        '200':
          description: 按创建时间倒序返回的付款状态及分页信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPayoutStatusEnvelope'
              example:
                code: 0
                message: ''
                data:
                  payouts:
                    - payout_id: fpo_01JQ90GQJTC5P7B2D8N6R4K1MX
                      client_reference_id: payout_20260730_0001
                      quote_id: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
                      provider: sgb
                      status: completed
                      payout_type: swift
                      source_currency: USD
                      destination_currency: USD
                      destination_country: US
                      amount_mode: receive
                      fee_paid_by: PAYER
                      sending_amount: '1051.05'
                      receiving_amount: '1000.00'
                      transfer_fee_amount: '1.05'
                      bank_fee_amount: '50.00'
                      fee_rate_decimal: '0.001'
                      rate: '1'
                      billing:
                        currency: USD
                        transfer_fee: '1.05'
                        fx_fee: '0.00'
                        rail_fee: '50.00'
                        total_fee: '51.05'
                        fee_lines:
                          - type: transfer_fee
                            amount: '1.05'
                            currency: USD
                            rate: '0.001'
                          - type: rail_fee
                            amount: '50.00'
                            currency: USD
                            rate: '1'
                      destination:
                        type: bank_account
                        account_holder_type: business
                        account_holder_name: Acme Supplies LLC
                        bank_country: US
                        bank_name: Example Bank
                        account_number_masked: '******3210'
                        swift_code: BOFAUS3NXXX
                      purpose_code: goods_and_services
                      statement_reference: INV-2026-0730
                      bank_reference: RMTO2084957259539812352
                      failure: null
                      return: null
                      created_at: 1786587000
                      updated_at: 1786587871
                      completed_at: 1786587871
                  total: 1
                  page: 1
                  page_size: 20
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: curl
          label: cURL (HMAC)
          source: |-
            curl -i -X POST \
              '{{INFINI_BASE_URL}}/v2/payouts/status/batch' \
              -H 'Content-Type: application/json' \
              -H 'Date: <GMT date>' \
              -H 'Digest: SHA-256=<base64(sha256(request body))>' \
              -H 'Authorization: Signature keyId="{{INFINI_KEY_ID}}",algorithm="hmac-sha256",headers="@request-target date",signature="<signature>"' \
              -d '{
                "start_time": 1786500000,
                "end_time": 1786599999,
                "page": 1,
                "page_size": 20
              }'
  /v2/payouts/{payout_id}:
    get:
      operationId: getFiatPayout
      summary: 查询法币付款
      description: >-
        返回当前鉴权组织的一笔付款最新状态。需要 `payout.read` 权限。


        `processing` 表示仍在执行；`completed` 表示付款已成功完成。对端银行仍可能拒收并退回一笔已经完成的汇款；原付款继续保持
        `completed`，可选的 `return` 对象会描述银行退汇和独立退款。`failed` 表示付款在银行成功完成前失败。

              type: object
              additionalProperties: false
              required:
                - payouts
                - total
                - page
                - page_size
                - total_pages
              properties:
                payouts:
                  type: array
                  description: 按创建时间倒序排列的付款状态。
                  items:
                    $ref: '#/components/schemas/PayoutStatusItem'
                total:
                  type: integer
                  format: int64
                  description: 时间区间内符合条件的付款总数。
                  example: 1
                page:
                  type: integer
                  description: 当前页码。
                  example: 1
                page_size:
                  type: integer
                  description: 请求的每页数量。
                  example: 20
                total_pages:
                  type: integer
                  description: 总页数。
                  example: 1
    Payout:
      type: object
      required:
        - payout_id
        - client_reference_id
        - quote_id
        - provider
        - status
        - payout_type
        - source_currency
        - destination_currency
        - destination_country
        - amount_mode
        - fee_paid_by
        - sending_amount
        - receiving_amount
        - transfer_fee_amount
        - bank_fee_amount
        - fee_rate_decimal
        - rate
        - billing
        - destination
        - purpose_code
        - statement_reference
        - bank_reference
        - failure
        - return
        - is_duplicate
        - created_at
        - updated_at
        - completed_at
      properties:
        payout_id:
          type: string
          description: Infini 法币付款 ID。
          example: fpo_01JQ90GQJTC5P7B2D8N6R4K1MX
        client_reference_id:
          type: string
          description: 商户提供的付款对账引用。
          example: payout_20260730_0001
        quote_id:
          type: string
          description: 创建付款时使用的 Quote。
          example: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
        provider:
          type: string
          enum:
            - sgb
          readOnly: true
          description: Infini 选择的执行服务商。
          example: sgb
        status:
          type: string
          enum:
            - processing
            - completed
            - failed
          description: 当前付款生命周期状态。对端银行退汇不会改变已完成付款的状态；请查看 `return` 对象了解独立退款。API 付款没有待审批状态。
          example: processing
        payout_type:
          type: string
          enum:
            - swift
          description: Quote 绑定的付款通道。
          example: swift
        source_currency:
          type: string
          enum:
            - USD
          description: 组织余额币种。
          example: USD
        destination_currency:
          type: string
          enum:
            - USD
          description: 收款人到账币种。
          example: USD
        destination_country:
          type: string
          description: ISO 3166-1 alpha-2 格式的目标国家代码。
          example: US
        amount_mode:
          type: string
          enum:
            - send
            - receive
          description: 已接受 Quote 固定的金额侧。
          example: receive
        fee_paid_by:
          type: string
          enum:
            - PAYER
            - BENEFICIARY
          description: 付款手续费承担方。`PAYER` 表示手续费外扣；`BENEFICIARY` 表示手续费内扣，并持久化用于账单对账。
          example: PAYER
        sending_amount:
          type: string
          description: 来源余额的实际总扣款，也是账单明细中的权威支出金额。
          example: '1051.05'
        receiving_amount:
          type: string
          description: 收款人的到账金额。
          example: '1000.00'
        transfer_fee_amount:
          type: string
          description: Quote 已固定的 Infini 服务费，不包含任何银行或通道费。
          example: '1.05'
        bank_fee_amount:
          type: string
          description: Quote 已固定的所选银行及付款通道手续费。通道类型包括 SWIFT、ACH 或 Wire。
          example: '50.00'
        fee_rate_decimal:
          type: string
          description: Quote 固定的小数形式转账费率。
          example: '0.001'
        rate:
          type: string
          description: Quote 固定的汇率。
          example: '1'
        billing:
          $ref: '#/components/schemas/BillingBreakdown'
        destination:
          $ref: '#/components/schemas/BankDestinationView'

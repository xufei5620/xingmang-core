                      updated_at: 1786674271
                      completed_at: 1786587871
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: curl
          label: cURL (HMAC)
          source: |-
            curl -i -X GET \
              '{{INFINI_BASE_URL}}/v2/payouts/fpo_01JQ90GQJTC5P7B2D8N6R4K1MX' \
              -H 'Date: <GMT date>' \
              -H 'Authorization: Signature keyId="{{INFINI_KEY_ID}}",algorithm="hmac-sha256",headers="@request-target date",signature="<signature>"'
components:
  parameters:
    DateHeader:
      name: Date
      in: header
      required: false
      description: GMT 服务器时间，例如 Tue, 21 Jan 2025 12:00:00 GMT。实际请求必填；Try it 签名器会自动注入。
      schema:
        type: string
        example: Tue, 30 Jul 2026 08:50:00 GMT
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      description: >-
        HMAC-SHA256 `Signature` 请求头。实际请求必填；Try it
        签名器会自动注入。详见[鉴权](/docs/en/4-authorization)指南。
      schema:
        type: string
        example: >-
          Signature
          keyId="key_example",algorithm="hmac-sha256",headers="@request-target
          date",signature="<signature>"
    DigestHeader:
      name: Digest
      in: header
      required: false
      description: 请求存在 Body 时实际请求必须携带 SHA-256 摘要；Try it 签名器会自动注入。
      schema:
        type: string
        example: SHA-256=<base64(sha256(request body))>
    PayoutId:
      name: payout_id
      in: path
      required: true
      description: Infini 法币付款 ID。
      schema:
        type: string
        example: fpo_01JQ90GQJTC5P7B2D8N6R4K1MX
  responses:
    BadRequest:
      description: 请求语法或字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 30013
            message: amount must be a positive decimal string
            data:
              error: invalid_parameter
              field: amount
              retryable: false
    Unauthorized:
      description: HMAC 网关校验或应用鉴权失败
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/GatewayError'
          examples:
            gatewayAuthenticationFailed:
              summary: 网关无法校验签名请求
              value:
                message: client request can't be validated
            applicationAuthenticationFailed:
              summary: 应用鉴权上下文无效
              value:
                code: 401
                message: Unauthorized
                data:
                  error: authentication_failed
                  field: null
                  retryable: false
    Forbidden:
      description: API Key 权限、IP 白名单或组织资格校验拒绝请求
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/GatewayError'
          examples:
            permissionDenied:
              summary: 付款权限、IP 策略或组织访问被拒绝
              value:
                code: 403
                message: Payout access is denied
                data:
                  error: permission_denied
                  field: null
                  retryable: false
            payoutSourceAccountNotFound:
              summary: 组织没有 USD 付款账户
              value:
                code: 108010
                message: USD payout account is not available for this organization
                data:
                  error: payout_source_account_not_found
                  field: null
                  retryable: false
    NotFound:
      description: 当前鉴权组织下不存在该资源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            payoutNotFound:
              summary: 当前鉴权组织下不存在该付款
              value:
                code: 404
                message: Payout does not exist
                data:
                  error: resource_not_found
                  field: payout_id
                  retryable: false
            quoteNotFound:
              summary: 当前鉴权组织下不存在该 Quote
              value:
                code: 404
                message: Quote does not exist
                data:
                  error: resource_not_found
                  field: quote_id
                  retryable: false
    Conflict:
      description: 请求与幂等数据、Quote 状态或另一笔付款提交发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            idempotencyConflict:
              summary: 幂等引用被用于不同的请求数据
              value:
                code: 108012
                message: client_reference_id was already used for a different request
                data:
                  error: idempotency_conflict
                  field: client_reference_id
                  retryable: false
            quoteAlreadyUsed:
              summary: 报价已经被消费
              value:
                code: 108013
                message: Quote has already been used
                data:
                  error: quote_already_used
                  field: quote_id
                  retryable: false
            quoteNotActive:
              summary: 报价当前不可用
              value:
                code: 108014
                message: Quote is not active
                data:
                  error: quote_not_active
                  field: quote_id
                  retryable: false
            submissionInProgress:
              summary: 当前组织已有另一笔付款正在提交
              value:
                code: 108015
                message: >-
                  Another payout submission is in progress. Please retry
                  shortly.
                data:
                  error: payout_submission_in_progress
                  field: null
                  retryable: true
            payoutSourceAccountInvalid:
              summary: 付款账户的 USD 配置不一致
              value:
                code: 108011
                message: USD payout account configuration is invalid. Contact support.
                data:
                  error: payout_source_account_invalid
                  field: null
                  retryable: false
    UnprocessableEntity:
      description: 请求语法正确，但未通过付款资格或执行校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidFeeMode:
              summary: 手续费模式无效
              value:
                code: 108001
                message: amount_mode and fee_paid_by are not supported together
                data:
                  error: invalid_fee_mode
                  field: fee_paid_by
                  retryable: false
            quoteExpired:
              summary: 报价已过期
              value:
                code: 108002
                message: Quote has expired
                data:
                  error: quote_expired
                  field: quote_id
                  retryable: true
            quoteUnavailable:
              summary: 报价暂时不可用
              value:
                code: 108003
                message: Payout quote is temporarily unavailable
                data:
                  error: quote_unavailable
                  field: null
                  retryable: true
            amountExceedsLimit:
              summary: 金额超过支持的限额
              value:
                code: 108004
                message: Payout amount exceeds the supported limit
                data:
                  error: amount_exceeds_limit
                  field: amount
                  retryable: false
            amountTooSmall:
              summary: 金额低于支持的最小值
              value:
                code: 108005
                message: Payout sending amount must be greater than 100 USD
                data:
                  error: amount_too_small
                  field: amount
                  retryable: false
            insufficientBalance:
              summary: 可用余额不足
              value:
                code: 108006
                message: Insufficient payout balance
                data:
                  error: insufficient_balance
                  field: amount
                  retryable: false
            dailyLimitExceeded:
              summary: 金额将超过账户共享的每日提现限额
              value:
                code: 108007
                message: Payout would exceed the account's daily withdrawal limit
                data:
                  error: daily_limit_exceeded
                  field: amount
                  retryable: false
    ServiceUnavailable:
      description: 付款执行服务或服务商流动性暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 108009
            message: Payout service is temporarily unavailable. Please try again later.
            data:
              error: payout_service_unavailable
              field: null
              retryable: true
    InternalError:
      description: 发生未预期的内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 500
            message: An error occurred internally
            data:
              error: internal_error
              field: null
              retryable: true
  schemas:
    StandardEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          enum:
            - 0
          description: 业务码，`0` 表示成功。
          example: 0
        message:
          type: string
          description: 响应消息。
          example: ''
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          minimum: 1
          description: 稳定的非零业务错误码。Fiat Payout 专属错误使用预留的 108001-108099 号段。
          example: 108002
        message:
          type: string
          description: 供排查使用的可读错误信息，不应作为程序分支依据。
          example: Quote has expired
        data:
          $ref: '#/components/schemas/ErrorData'
    ErrorData:
      type: object
      required:
        - error
        - field
        - retryable
      properties:
        error:
          type: string
          description: 稳定的机器可读错误标识。
          example: quote_expired
        field:
          type: string
          nullable: true
          description: 与错误相关的请求字段；不适用时为空。
          example: quote_id
        retryable:
          type: boolean
          description: 修正临时状态后重试是否可能成功。
          example: true
    GatewayError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: 网关校验错误。
          example: client request can't be validated
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - amount_mode
        - fee_paid_by
        - source_currency
        - destination_currency
        - destination_country
        - payout_type
        - destination
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
          description: 按 `amount_mode` 含义填写的正数 USD 金额。
          example: '1000.00'
        amount_mode:
          type: string
          enum:
            - send
            - receive
          description: '`amount` 固定的金额侧。`send` 表示来源账户扣款；`receive` 表示收款金额。'
          example: receive
        fee_paid_by:
          type: string
          enum:
            - PAYER
            - BENEFICIARY
          description: >-
            手续费承担方及金额计算输入。`PAYER` 表示手续费外扣；`BENEFICIARY` 表示手续费内扣。第一期只接受 `receive`
            与 `PAYER`，或 `send` 与 `BENEFICIARY`。
          example: PAYER
        source_currency:
          type: string
          enum:
            - USD
          description: 组织余额币种。第一期仅支持 USD。
          example: USD
        destination_currency:
          type: string
          enum:
            - USD
          description: 收款人到账币种。付款 Quote 当前仅支持 USD。
          example: USD
        destination_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 格式的目标国家代码。
          example: US
        payout_type:
          type: string
          enum:
            - swift
          description: 付款通道。当前仅支持 SWIFT。
          example: swift
        destination:
          $ref: '#/components/schemas/BankDestinationInput'
    BankDestinationInput:
      type: object
      additionalProperties: false
      required:
        - type
        - account_holder_type
        - account_holder_name
        - bank_country
        - bank_name
        - account_number
        - swift_code
      properties:
        type:
          type: string
          enum:
            - bank_account
          description: 收款目标类型。
          example: bank_account
        account_holder_type:
          type: string
          enum:
            - individual
            - business
          description: 银行账户持有人的法律主体类型。
          example: business
        account_holder_name:
          type: string
          minLength: 1
          maxLength: 140
          description: 银行账户登记的完整法定名称。
          example: Acme Supplies LLC
        bank_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 格式的银行国家代码。
          example: US
        bank_name:
          type: string
          minLength: 1
          maxLength: 140
          description: 收款银行的法定名称。
          example: Example Bank
        account_number:
          type: string
          minLength: 4
          maxLength: 34
          writeOnly: true
          description: 收款银行账号。
          example: '9876543210'
        swift_code:
          type: string
          pattern: ^[A-Z0-9]{8}([A-Z0-9]{3})?$
          description: 收款银行的 SWIFT/BIC Code。
          example: BOFAUS3NXXX
        address:
          $ref: '#/components/schemas/PostalAddress'
    PostalAddress:
      type: object
      additionalProperties: false
      required:
        - line1
        - city
        - postal_code
        - country
      properties:
        line1:
          type: string
          description: 主要街道地址。
          example: 123 Market Street
        line2:
          type: string
          nullable: true
          description: 补充地址。
          example: Suite 500
        city:
          type: string
          description: 城市或地区。
          example: New York
        state:
          type: string
          nullable: true
          description: 州、省或地区。
          example: NY
        postal_code:
          type: string
          description: 邮政编码。
          example: '10001'
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 格式的地址国家代码。
          example: US
    BankDestinationView:
      type: object
      required:
        - type
        - account_holder_type
        - account_holder_name
        - bank_country
        - bank_name
        - account_number_masked
        - swift_code
      properties:
        type:
          type: string
          enum:
            - bank_account
          description: 收款目标类型。
          example: bank_account
        account_holder_type:
          type: string
          enum:
            - individual
            - business
          description: 银行账户持有人的法律主体类型。
          example: business
        account_holder_name:
          type: string
          description: 银行账户登记的完整法定名称。
          example: Acme Supplies LLC
        bank_country:
          type: string
          description: ISO 3166-1 alpha-2 格式的银行国家代码。
          example: US
        bank_name:
          type: string
          description: 收款银行的法定名称。
          example: Example Bank
        account_number_masked:
          type: string
          description: 脱敏银行账号；响应永远不会返回完整账户资料。
          example: '******3210'
        swift_code:
          type: string
          description: 收款银行的 SWIFT/BIC Code。
          example: BOFAUS3NXXX
    FeeLine:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - currency
        - rate
      properties:
        type:
          type: string
          enum:
            - transfer_fee
            - fx_fee
            - rail_fee
          description: 手续费分项类型。
          example: transfer_fee
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
          description: 以 `currency` 计价的手续费分项金额。
          example: '1.05'
        currency:
          type: string
          enum:
            - USD
          description: 手续费分项币种。
          example: USD
        rate:
          type: string
          description: 该费用分项使用的小数费率；固定通道费返回 `1`。
          example: '0.001'
    BillingBreakdown:
      type: object
      additionalProperties: false
      required:
        - currency
        - transfer_fee
        - fx_fee
        - rail_fee
        - total_fee
        - fee_lines
      properties:
        currency:
          type: string
          enum:
            - USD
          description: 所有费用明细金额使用的币种。
          example: USD
        transfer_fee:
          type: string
          description: Infini 为处理该笔付款收取的服务费，不包含任何银行或通道费。
          example: '1.05'
        fx_fee:
          type: string
          description: 外汇兑换费。当前 USD 到 USD 路由固定为 `0.00`。
          example: '0.00'
        rail_fee:
          type: string
          description: 所选银行及付款通道对应的银行手续费。
          example: '50.00'
        total_fee:
          type: string
          description: '`billing` 中所有手续费项目的合计。'
          example: '51.05'
        fee_lines:
          type: array
          description: 用于对账的手续费分项。
          items:
            $ref: '#/components/schemas/FeeLine'
    Quote:
      type: object
      required:
        - quote_id
        - provider
        - payout_type
        - source_currency
        - destination_currency
        - destination_country
        - amount_mode
        - fee_paid_by
        - sending_amount
        - receiving_amount
        - transfer_fee_amount
        - bank_fee_amount
        - fee_rate_decimal
        - rate
        - billing
        - destination
        - expires_at
      properties:
        quote_id:
          type: string
          description: 有时效性的付款 Quote ID。
          example: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
        provider:
          type: string
          enum:
            - sgb
          readOnly: true
          description: 只读的执行服务商标识。
          example: sgb
        payout_type:
          type: string
          enum:
            - swift
          description: Quote 绑定的付款通道。
          example: swift
        source_currency:
          type: string
          enum:
            - USD
          description: 组织余额币种。
          example: USD
        destination_currency:
          type: string
          enum:
            - USD
          description: 收款人到账币种。
          example: USD
        destination_country:
          type: string
          description: ISO 3166-1 alpha-2 格式的目标国家代码。
          example: US
        amount_mode:
          type: string
          enum:
            - send
            - receive
          description: Quote 请求固定的金额侧。
          example: receive
        fee_paid_by:
          type: string
          enum:
            - PAYER
            - BENEFICIARY
          description: 付款手续费承担方。`PAYER` 表示手续费外扣；`BENEFICIARY` 表示手续费内扣。
          example: PAYER
        sending_amount:
          type: string
          description: 组织来源余额的实际总扣款，对账时应作为该笔付款的支出金额。
          example: '1051.05'
        receiving_amount:
          type: string
          description: 收款人的到账金额。
          example: '1000.00'
        transfer_fee_amount:
          type: string
          description: Infini 为处理该笔付款收取的服务费，不包含任何银行或通道费，与 `billing.transfer_fee` 相等。
          example: '1.05'
        bank_fee_amount:
          type: string
          description: 所选银行及付款通道对应的银行手续费，例如 SWIFT、ACH 或 Wire。该字段与 `billing.rail_fee` 相等。
          example: '50.00'
        fee_rate_decimal:
          type: string
          description: Quote 使用的小数形式转账费率。
          example: '0.001'
        rate:
          type: string
          description: 每 1 单位来源币种可兑换的目标币种数量。
          example: '1'
        billing:
          $ref: '#/components/schemas/BillingBreakdown'
        destination:
          $ref: '#/components/schemas/BankDestinationView'
        expires_at:
          type: integer
          format: int64
          description: Quote 过期时间，Unix 秒。
          example: 1786586700
    QuoteEnvelope:
      allOf:
        - $ref: '#/components/schemas/StandardEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Quote'
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required:
        - client_reference_id
        - quote_id
        - purpose_code
      properties:
        client_reference_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: 在商户范围内标识一笔逻辑付款的幂等与对账引用。
          example: payout_20260730_0001
        quote_id:
          type: string
          description: 当前鉴权组织拥有且未过期的 Quote，绑定收款资料、金额、手续费承担方、服务商、通道和定价。
          example: poq_01JQ90B8S5VJ6R3T7F1M2C4N9X
        purpose_code:
          type: string
          minLength: 1
          maxLength: 64
          description: 当前付款路由接受的业务用途代码。
          example: goods_and_services
        statement_reference:
          type: string
          minLength: 1
          maxLength: 35
          description: 银行通道支持时向收款人展示的附言。
          example: INV-2026-0730
    BatchPayoutStatusRequest:
      type: object
      additionalProperties: false
      required:
        - start_time
        - end_time
      properties:
        start_time:
          type: integer
          format: int64
          minimum: 1
          description: 付款创建时间区间的开始时间（含），Unix 秒。
          example: 1786500000
        end_time:
          type: integer
          format: int64
          minimum: 1
          description: 付款创建时间区间的结束时间（含），Unix 秒，必须大于或等于 `start_time`。
          example: 1786599999
        page:
          type: integer
          minimum: 1
          default: 1
          description: 页码。
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 每页付款数量。
          example: 20
    PayoutStatusItem:
      type: object
      additionalProperties: false
      required:
        - payout_id
        - client_reference_id
        - quote_id
        - provider
        - status
        - payout_type
        - source_currency
        - destination_currency
        - destination_country
        - amount_mode
        - fee_paid_by
        - sending_amount
        - receiving_amount
        - transfer_fee_amount
        - bank_fee_amount
        - fee_rate_decimal
        - rate
        - billing

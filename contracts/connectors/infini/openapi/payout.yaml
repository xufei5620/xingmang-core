          format: int64
          nullable: true
          description: 银行合作方报告付款完成的时间，Unix 秒。
          example: 1786587871
    Failure:
      type: object
      nullable: true
      description: 付款未能完成时的失败详情；其他状态为空。
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 稳定的机器可读付款失败代码。
          example: payout_failed
        message:
          type: string
          description: 可读的付款失败详情。
          example: The payout could not be completed
    PayoutReturn:
      type: object
      nullable: true
      additionalProperties: false
      description: 对端银行退回已完成付款后产生的独立退款；其他情况为空。原付款继续保持 `completed`。
      required:
        - status
        - reason_code
        - reason
        - returned_amount
        - refund_amount
        - retained_fee
        - currency
        - returned_at
      properties:
        status:
          type: string
          enum:
            - refunded
          description: 独立退款的入账状态。
          example: refunded
        reason_code:
          type: string
          enum:
            - recipient_bank_rejected
          description: 稳定的机器可读银行退回原因。
          example: recipient_bank_rejected
        reason:
          type: string
          description: 银行合作方提供的可读退汇原因。
          example: Beneficiary bank rejected the transfer
        returned_amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
          description: 银行合作方报告的退回金额。
          example: '1000.00'
        refund_amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
          description: 扣除保留手续费后实际退回组织余额的金额。
          example: '1000.00'
        retained_fee:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
          description: 原付款保留且未计入 `refund_amount` 的手续费。
          example: '51.05'
        currency:
          type: string
          enum:
            - USD
          description: 退回金额、退款金额和保留手续费的币种。
          example: USD
        returned_at:
          type: integer
          format: int64
          description: 独立退款入账时间，Unix 秒。
          example: 1786674271
    PayoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/StandardEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Payout'
  securitySchemes:
    InfiniHmac:
      type: http
      scheme: basic
      description: 从 Infini 后台获取的 Sandbox API **Key**（keyId）与 **Secret**。
security:
  - InfiniHmac: []

services:
  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-invoice-bootstrap-admin}
    secrets:
      - keycloak_app_db_password
      - keycloak_bootstrap_admin_password

secrets:
  keycloak_bootstrap_admin_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/keycloak_bootstrap_admin_password

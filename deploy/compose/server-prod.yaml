# 星芒统一控制平台 —— 服务器 production 覆盖
#
# 这是生产配置的显式闸门，不是「把 ENVIRONMENT 改成 production」的快捷方式：
# 1) OIDC 参数必须由部署环境显式提供；
# 2) 三条采集链必须显式选择 real 或显式关闭，不能继承 fake 演示默认值；
# 3) 演示种子固定关闭；
# 4) web 仍只绑回环，TLS/OIDC 入口由宿主 Nginx 配置承担。
#
# Compose 的 :? 插值故意让缺配置在 config 阶段失败，避免 build/up 后才发现。
services:
  # 001_staging_seed.sql 只允许在 staging profile 里运行；生产部署不启用
  # 该 profile，因此不会把 sub2api-staging 或其它演示行写进生产库。
  bootstrap:
    profiles: ["staging"]

  migrate:
    environment:
      ENVIRONMENT: production

  platform-api:
    environment:
      ENVIRONMENT: production
      # XM-LOGIN：默认改为 local（平台自带登录，见 docs/modules/httpapi/
      # AUTH-SWITCH.md「local 模式」一节）。仍可显式设成 oidc 切回 CR-0001
      # 的 Keycloak 登录——两者都是生产允许的模式，dev-header 仍被 Go 侧的
      # authConfigFromEnv 硬拒绝。
      XM_AUTH_MODE: ${XM_AUTH_MODE:-local}
      # issuer/audience 不再是 compose 级的必填闸（`:?`）：local 模式下根本
      # 用不到它们。生产的合法性改由 Go 侧强制——XM_AUTH_MODE=oidc 时
      # authConfigFromEnv 仍然会在缺 issuer/audience 时拒绝启动（Fail Closed
      # 没有削弱，只是校验点从「compose 展开」挪到了「进程启动」）。
      XM_OIDC_ISSUER: ${XM_OIDC_ISSUER:-}
      XM_OIDC_AUDIENCE: ${XM_OIDC_AUDIENCE:-}
      XM_OIDC_JWKS_URL: ${XM_OIDC_JWKS_URL:-}
      XM_OIDC_ROLE_SCOPES: ${XM_OIDC_ROLE_SCOPES:-}
      XM_OIDC_CLOCK_SKEW: ${XM_OIDC_CLOCK_SKEW:-}
      XM_FINANCE_FAKE_SEED: "false"
      # --- 请求详情 file 模式（XM-REQLOG-MERGE）------------------------------
      # 容器内路径固定为下面两个默认值，与下方 volumes 的挂载目标一一对应；
      # 真正切换要不要读 file 模式由 .env 的 XM_REQLOG_MODE 决定（默认继承
      # launch.yaml 的 off，不随这份 prod 覆盖自动开启——见
      # docs/runbooks/REQLOG-RECORDER.md 的切换步骤）。
      XM_REQLOG_DATA_DIR: ${XM_REQLOG_DATA_DIR:-/var/lib/xm/reqlog}
      XM_REQLOG_TOKENMAP: ${XM_REQLOG_TOKENMAP:-/var/lib/xm/reqlog-tokenmap.json}
      # --- CPA 逐 key 用量 file 模式（XM-CPA0）--------------------------------
      # 容器内路径固定为下面的默认值，与下方 volumes 的挂载目标一一对应；
      # 真正切换要不要读 file 模式由 .env 的 XM_CPA_MODE 决定（默认继承
      # launch.yaml 的 off，不随这份 prod 覆盖自动开启——与 XM_REQLOG_MODE
      # 同一条纪律）。
      XM_CPA_DATA_DIR: ${XM_CPA_DATA_DIR:-/var/lib/xm/cpa}
    volumes:
      # 只读绑定挂载记录代理（cmd/reqlog-recorder，宿主机 systemd 服务）落盘
      # 的数据目录与令牌映射文件。`:ro` 是这条链路唯一的权限边界——容器内
      # 是只读文件系统视角，即便应用代码有 bug 也写不了宿主机上的原始数据
      # （ADR-011：控制面不直写数据面的原始存储）。宿主机路径可由 .env 的
      # XM_REQLOG_HOST_DATA_DIR / XM_REQLOG_HOST_TOKENMAP 覆盖；默认值对应
      # 记录代理自己的默认落盘位置（cmd/reqlog-recorder 的 DefaultDataDir /
      # DefaultTokenMapPath）。这两个宿主机路径在部署这份覆盖的机器上必须
      # 已经存在，否则 Docker 会把它们当成空目录创建——那样容器能起来，但
      # 读到的是空的请求列表，不是报错，排查时先看这里。
      - ${XM_REQLOG_HOST_DATA_DIR:-/root/reqlog/data}:/var/lib/xm/reqlog:ro
      - ${XM_REQLOG_HOST_TOKENMAP:-/root/reqlog/tokenmap.json}:/var/lib/xm/reqlog-tokenmap.json:ro
      # 只读绑定挂载 cpa-manager-plus 自己的 usage.sqlite 所在**整个目录**
      # （不是单个文件）：WAL 模式的 SQLite 读者需要同目录下 -wal/-shm 兄弟
      # 文件的读权限，只挂 .sqlite 本身会让读取在 checkpoint 前后不稳定
      # （见 connectors/cpa 包文档 §2）。**绝不**与 /root/cpa-stack/cpa/auths
      # 或 config.yaml 混在一起挂——那两个含上游 OAuth 令牌与 API key，凭据
      # 不进平台容器（宪法 7 条）。宿主机路径可由 XM_CPA_HOST_DATA_DIR 覆盖；
      # 默认值对应 cpa-manager-plus 自己的落盘位置。
      - ${XM_CPA_HOST_DATA_DIR:-/root/cpa-stack/cpam-data}:/var/lib/xm/cpa:ro

  platform-worker:
    environment:
      ENVIRONMENT: production
      # 必须显式写值；worker 自身还会拒绝 production + fake + enabled。
      XM_SUB2API_MODE: ${XM_SUB2API_MODE:?XM_SUB2API_MODE must be explicitly set (real or fake with sync disabled)}
      XM_SUB2API_INSTANCE_ID: ${XM_SUB2API_INSTANCE_ID:?XM_SUB2API_INSTANCE_ID is required for production}
      XM_SUB2API_SYNC_ENABLED: ${XM_SUB2API_SYNC_ENABLED:-true}
      XM_SUB2API_SYNC_INTERVAL: ${XM_SUB2API_SYNC_INTERVAL:-300s}
      XM_NEWAPI_MODE: ${XM_NEWAPI_MODE:?XM_NEWAPI_MODE must be explicitly set (real or fake with sync disabled)}
      XM_NEWAPI_INSTANCE_ID: ${XM_NEWAPI_INSTANCE_ID:?XM_NEWAPI_INSTANCE_ID is required for production}
      XM_NEWAPI_SYNC_ENABLED: ${XM_NEWAPI_SYNC_ENABLED:-true}
      XM_NEWAPI_SYNC_INTERVAL: ${XM_NEWAPI_SYNC_INTERVAL:-300s}
      XM_FINANCE_COLLECT_MODE: ${XM_FINANCE_COLLECT_MODE:?XM_FINANCE_COLLECT_MODE must be explicitly set (real or fake with collection disabled)}
      XM_FINANCE_COLLECT_ENABLED: ${XM_FINANCE_COLLECT_ENABLED:-true}
      XM_FINANCE_COLLECT_INTERVAL: ${XM_FINANCE_COLLECT_INTERVAL:-300s}
      XM_FINANCE_COLLECT_REQUEST_TIMEOUT: ${XM_FINANCE_COLLECT_REQUEST_TIMEOUT:-30s}
      XM_FINANCE_COLLECT_INSTANCE_ID: ${XM_FINANCE_COLLECT_INSTANCE_ID:?XM_FINANCE_COLLECT_INSTANCE_ID is required for production}
      HEARTBEAT_RUN_ON_START: ${HEARTBEAT_RUN_ON_START:-true}
      # --- 请求量/成功率聚合 file 模式（XM-REQLOG-METRICS）--------------------
      # 容器内路径固定为下面的默认值，与下方 volumes 的挂载目标一一对应；
      # 是否读 file 模式仍由 .env 的 XM_REQLOG_MODE 决定（与 platform-api 共享
      # 同一个变量，见该服务同名注释），这里不强制生产必须打开——没有部署
      # 记录代理的环境本来就该让这三张卡片如实缺席，而不是被这份 prod 覆盖
      # 强行要求配置一个不存在的目录。
      XM_REQLOG_DATA_DIR: ${XM_REQLOG_DATA_DIR:-/var/lib/xm/reqlog}
      # --- CPA 周期同步（cpa_sync，XM-CPA0）----------------------------------
      # 没有 fake 模式可选，因此不像上面几条那样用 `:?` 强制显式选择——
      # off 本身就是生产的合法状态（还没接入这条数据源）。真正切换到 file
      # 由 .env 的 XM_CPA_MODE 决定，默认继承 launch.yaml 的 off。
      XM_CPA_DATA_DIR: ${XM_CPA_DATA_DIR:-/var/lib/xm/cpa}
      XM_CPA_INSTANCE_ID: ${XM_CPA_INSTANCE_ID:-cpa-cli-proxy-api}
    volumes:
      # 只读绑定挂载记录代理落盘的数据目录——与 platform-api 挂载的是同一份
      # 宿主机路径（XM_REQLOG_HOST_DATA_DIR，默认 /root/reqlog/data），但
      # **不挂 tokenmap.json**：worker 只聚合计数（status/dur_ms/ts_ms），
      # 不解析 token_prefix 到用户名，没有理由让这个只读凭据映射文件的访问面
      # 多一个容器。挂载语义与权限边界见 platform-api 服务块的同款注释。
      - ${XM_REQLOG_HOST_DATA_DIR:-/root/reqlog/data}:/var/lib/xm/reqlog:ro
      # 与 platform-api 同一个宿主机目录、同一条只读纪律（见上方 platform-api
      # 的挂载注释）——worker 需要自己独立的只读句柄来跑周期同步，两个容器
      # 各挂各的，互不影响。
      - ${XM_CPA_HOST_DATA_DIR:-/root/cpa-stack/cpam-data}:/var/lib/xm/cpa:ro

  web:
    environment:
      # XM-LOGIN / CR-0004：生产默认使用平台自带 local 登录；admin-web 已支持
      # xm_session Cookie。仍可显式把 API/Web 两侧同时切回 oidc（CR-0001），
      # issuer / client id 默认取后端同名配置，两侧必须成对，禁止一侧 local、
      # 一侧 oidc。dev-header 在生产由后端配置校验硬拒绝。
      XM_WEB_AUTH_MODE: ${XM_WEB_AUTH_MODE:-local}
      XM_WEB_OIDC_ISSUER: ${XM_WEB_OIDC_ISSUER:-${XM_OIDC_ISSUER:-}}
      XM_WEB_OIDC_CLIENT_ID: ${XM_WEB_OIDC_CLIENT_ID:-${XM_OIDC_AUDIENCE:-}}
    ports: !override
      # 生产入口由 TLS Nginx 反代；不要把管理后台直接绑到公网接口。
      # 端口跟 .env 的 WEB_PORT（宿主 Nginx 反代的上游）一致，只把绑定地址钉死在回环。
      - "127.0.0.1:${WEB_PORT:-8088}:80"

# 本地开发与集成测试用 PostgreSQL。生产 compose 另行交付（XM 部署任务）。
# 端口 5433，避开本机可能已占用的 5432。
services:
  postgres:
    image: docker.io/library/postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    environment:
      POSTGRES_USER: xingmang
      POSTGRES_PASSWORD: xingmang-dev
      POSTGRES_DB: xingmang
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingmang -d xingmang"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - xingmang-dev-pgdata:/var/lib/postgresql

volumes:
  xingmang-dev-pgdata:

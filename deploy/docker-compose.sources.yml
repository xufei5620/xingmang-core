name: invoice-source-agents-prod

x-source-common: &source-common
  image: invoice-source-agent:${INVOICE_IMAGE_TAG:?set the exact reviewed invoice release tag}
  pull_policy: never
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  environment: &source-environment
    SOURCE_MODE: db_projection
    SOURCE_DB_DIALECT: postgres
    INGESTION_ORIGIN: https://invoice-ingest.internal:8443
    INGESTION_ALLOWED_HOSTS: invoice-ingest.internal
    INGESTION_ALLOWED_PORTS: "8443"
    INGESTION_ALLOWED_CIDRS: ${INVOICE_INGEST_PROXY_CIDR:?set exact ingest-proxy /32}
    INGESTION_ALLOWED_METHODS: POST
    INGESTION_HTTP_TIMEOUT: 20s
    SOURCE_MTLS_CA_FILE: /run/secrets/source_agent_ca
    SOURCE_MTLS_SERVER_NAME: invoice-ingest.internal
    SOURCE_MTLS_RELOAD_ON_HANDSHAKE: "true"
    SOURCE_SCAN_LIMIT: "100"
    SOURCE_POLL_INTERVAL: 1m
    SOURCE_RECONCILE_INTERVAL: 6h
    SOURCE_RECONCILE_MISS_THRESHOLD: "3"
    NEWAPI_FULL_SCAN_INTERVAL: 1h
    SOURCE_MAX_BACKOFF: 1m
    SOURCE_MAX_PAGES_PER_CYCLE: "1000"
    SOURCE_MAX_CONSECUTIVE_FAILURES: "10"
    SOURCE_LOCAL_HEALTH_MAX_AGE: 5m
    SOURCE_TRUSTED_OIDC_ISSUER: ${OIDC_ISSUER_URL:?set central OIDC issuer}
  secrets:
    - source_agent_ca
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  healthcheck:
    test: ["CMD", "/source-agent-prod", "healthcheck"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 2m
  networks: [invoice_ingest]

services:
  sub2api-payments:
    <<: *source-common
    environment:
      <<: *source-environment
      SOURCE_ID: ${SUB2API_SOURCE_ID:?set registered Sub2API source UUID}
      SOURCE_TYPE: sub2api
      SOURCE_STATE_STREAM: payments
      SOURCE_SCHEMA_VERSION: "3.0"
      SOURCE_RUNTIME_VERSION: ${SUB2API_RUNTIME_VERSION:?set approved exact Sub2API runtime}
      SOURCE_DB_DSN_FILE: /run/secrets/sub2api_payments_reader_database_url
      SOURCE_STATE_FILE: /state/state.json
      SOURCE_SPOOL_FILE: /state/pending.enc
      SOURCE_SPOOL_KEY_FILE: /run/secrets/sub2api_payments_spool_key
      SOURCE_MTLS_CERT_FILE: /run/secrets/sub2api_agent_cert
      SOURCE_MTLS_KEY_FILE: /run/secrets/sub2api_agent_key
      SOURCE_SIGNING_KEY_FILE: /run/secrets/sub2api_payments_signing_key
      SOURCE_SIGNING_KEY_ID: ${SUB2API_PAYMENTS_SIGNING_KEY_ID:-2026-08-payments}
      SOURCE_CUTOVER_MANIFEST_FILE: /cutover/manifest.enc
      SOURCE_CUTOVER_KEY_FILE: /run/secrets/sub2api_cutover_key
    secrets:
      - source_agent_ca
      - sub2api_payments_reader_database_url
      - sub2api_payments_spool_key
      - sub2api_agent_cert
      - sub2api_agent_key
      - sub2api_payments_signing_key
      - sub2api_cutover_key
    volumes:
      - ${SOURCE_STATE_ROOT:?set SOURCE_STATE_ROOT}/sub2api-payments:/state
      - ${SOURCE_CUTOVER_ROOT:?set SOURCE_CUTOVER_ROOT}/sub2api:/cutover:ro
    networks: [invoice_ingest, sub2api_projection]

  sub2api-identities:
    <<: *source-common
    environment:
      <<: *source-environment
      SOURCE_ID: ${SUB2API_SOURCE_ID:?set registered Sub2API source UUID}
      SOURCE_TYPE: sub2api
      SOURCE_STATE_STREAM: identities
      SOURCE_SCHEMA_VERSION: "2.0"
      SOURCE_RUNTIME_VERSION: ${SUB2API_RUNTIME_VERSION:-0.1.179}
      SOURCE_DB_DSN_FILE: /run/secrets/sub2api_identities_reader_database_url
      SOURCE_STATE_FILE: /state/state.json
      SOURCE_RECONCILE_FILE: /state/reconcile.json
      SOURCE_SPOOL_FILE: /state/pending.enc
      SOURCE_SPOOL_KEY_FILE: /run/secrets/sub2api_identities_spool_key
      SOURCE_MTLS_CERT_FILE: /run/secrets/sub2api_agent_cert
      SOURCE_MTLS_KEY_FILE: /run/secrets/sub2api_agent_key
      SOURCE_SIGNING_KEY_FILE: /run/secrets/sub2api_identities_signing_key
      SOURCE_SIGNING_KEY_ID: ${SUB2API_IDENTITIES_SIGNING_KEY_ID:-2026-08-identities}
      SOURCE_TRUSTED_OIDC_PROVIDER_KEY: ${SUB2API_OIDC_PROVIDER_KEY:?set exact Sub2API central OIDC provider key}
    secrets:
      - source_agent_ca
      - sub2api_identities_reader_database_url
      - sub2api_identities_spool_key
      - sub2api_agent_cert
      - sub2api_agent_key
      - sub2api_identities_signing_key
    volumes:
      - ${SOURCE_STATE_ROOT:?set SOURCE_STATE_ROOT}/sub2api-identities:/state

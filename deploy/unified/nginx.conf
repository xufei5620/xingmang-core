# TLS terminates at the reviewed host reverse proxy. Both API prefixes reach one
# Go process. Invoice user routes retain their original root and public origin.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
include /etc/nginx/runtime/trusted-proxy.conf;
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    set $unified_api platform-api:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /internal/ { return 404; }
    location = /metrics { return 404; }
    location /api/ {
        proxy_pass http://$unified_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /invoice-api/v1/ {
        proxy_pass http://$unified_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Mock-User-ID "";
        proxy_set_header X-Mock-Role "";
        proxy_set_header X-Invoice-mTLS-Verified "";
        proxy_set_header X-Invoice-Client-Cert-Serial "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 24m;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }
    location /webhooks/ {
        proxy_pass http://$unified_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_request_buffering off;
        proxy_next_upstream off;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }
    location = /healthz { proxy_pass http://$unified_api; }
    location = /readyz { proxy_pass http://$unified_api; }
    location = /app-config.js {
        alias /etc/nginx/runtime/app-config.js;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8081;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/invoice;
    index index.html;
    set $unified_api platform-api:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    location /internal/ { return 404; }
    location = /metrics { return 404; }
    location /api/ { return 404; }
    location /admin { return 404; }
    location /embed/ { return 404; }
    location /invoice-api/v1/ {
        proxy_pass http://$unified_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Mock-User-ID "";
        proxy_set_header X-Mock-Role "";
        proxy_set_header X-Invoice-mTLS-Verified "";
        proxy_set_header X-Invoice-Client-Cert-Serial "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 24m;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }
    location = /healthz { proxy_pass http://$unified_api; }
    location = /readyz { proxy_pass http://$unified_api; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}

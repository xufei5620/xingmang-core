events {}

http {
    server_tokens off;
    access_log off;

    server {
        listen 8443 ssl;
        server_name invoice-ingest.internal;

        ssl_certificate     /run/secrets/ingest_server_cert;
        ssl_certificate_key /run/secrets/ingest_server_key;
        ssl_client_certificate /run/secrets/source_agent_ca;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 5m;

        location = /internal/v1/source-batches {
            limit_except POST { deny all; }
            proxy_pass http://api:8088;
            proxy_http_version 1.1;
            proxy_set_header Host invoice-ingest.internal;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Invoice-mTLS-Verified $ssl_client_verify;
            proxy_set_header X-Invoice-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Mock-User-ID "";
            proxy_set_header X-Mock-Role "";
            proxy_request_buffering on;
        }

        location / { return 404; }
    }
}

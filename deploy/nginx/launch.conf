# staging 一键启动栈的 Nginx 配置（deploy/compose/launch.yaml 的 web 服务）。
#
# 核心决定：admin-web 与 /api/ 同源。前端不配 API base URL，也就没有 CORS、
# 没有预检、没有「本地能跑上了 staging 就 403」那类环境差异。
# 反代 upstream 走 compose 网络内的服务名，不经宿主端口——本开发机的
# 宿主→容器端口转发被代理 TUN 劫持，任何绕宿主的路径都更可靠。

server {
    listen       80;
    server_name  _;

    # 探针响应里不该带服务器版本
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 反代到 platform-api。末尾都带 /：/api/v1/services → /api/v1/services
    # （platform-api 自己的路由前缀就是 /api/v1，这里不做路径改写）
    location /api/ {
        proxy_pass         http://platform-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Foundation-A 的 X-Dev-* 身份头必须原样透传；
        # CR-0001（Keycloak）之后换成 Authorization: Bearer，本段不需要改
        proxy_read_timeout 60s;
    }

    # Infini 卡片回调（XM-CARD4）。**公网入站，无鉴权，唯一的闸是 HMAC 签名。**
    #
    # 与 /api/ 分开写，因为约束不同：
    #
    #   签名覆盖的是原始请求体字节，任何改写（压缩、缓冲重组、字符集转换）
    #   都会让验签失败，且失败时长得像「密钥不对」，极难定位。所以这里
    #   关掉请求缓冲、不设任何 body 相关的改写。
    #
    #   三个 X-Webhook-* 头必须原样到达后端。nginx 默认会丢掉带下划线的头，
    #   这几个头是连字符命名的，不受影响；但仍显式声明，免得以后有人加了
    #   underscores_in_headers 之类的全局配置时以为这里也被覆盖到了。
    #
    #   请求体上限与后端的 64KB 对齐：更大的请求没必要走到应用层才被拒。
    location /webhooks/ {
        proxy_pass         http://platform-api:8080/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 64k;
        # 上游按自己的策略重试（最多 8 次），这里不做任何重试：
        # nginx 层重试会让同一个事件在后端多跑一遍，而去重靠的是事件 id，
        # 重跑虽然安全但白白打上游。
        proxy_next_upstream off;
        proxy_read_timeout 30s;
    }

    # 探针透传，方便从 web 这一层确认后端活着（看门狗只需要一个入口）
    location = /healthz { proxy_pass http://platform-api:8080/healthz; }
    location = /readyz  { proxy_pass http://platform-api:8080/readyz;  }

    # 带内容哈希的构建产物可以长缓存；index.html 不行，
    # 否则前端发版后浏览器还拿着旧的 asset 引用
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端运行时配置（XM-AUTH1）：容器启动时由 web-app-config.sh 生成，切换
    # 鉴权方式后重启即生效——所以它**绝不能被缓存**：浏览器拿着旧的
    # authMode=dev-header 去打已经切成 oidc 的后端，就是一屏「缺少身份」
    location = /app-config.js {
        add_header Cache-Control "no-store";
    }

    # SPA 兜底：react-router 的前端路由刷新时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: invoice-keycloak-prod

services:
  keycloak-postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_owner_db_password
    secrets: [keycloak_owner_db_password, keycloak_app_db_password]
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
      - ./keycloak/010-keycloak-app-role.sh:/docker-entrypoint-initdb.d/010-keycloak-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_owner -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [keycloak_db]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  keycloak:
    image: invoice-keycloak:${INVOICE_IMAGE_TAG:?set the exact reviewed invoice release tag}
    build:
      context: ./keycloak
      args:
        KEYCLOAK_BASE_IMAGE: ${KEYCLOAK_BASE_IMAGE:-quay.io/keycloak/keycloak:26.7.2@sha256:6efbadc00f0ed0237610becf11f4101b9c3ad8edf08a5b70c97aa4154ed436ec}
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_HOSTNAME: https://auth.solov.cc
      KC_HOSTNAME_ADMIN: https://auth-admin.solov.cc
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_DEBUG: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:?set the exact Keycloak Docker gateway IPv4 /32}
      KEYCLOAK_EDGE_GATEWAY: ${KEYCLOAK_EDGE_GATEWAY:?set the Keycloak edge gateway}
      JAVA_OPTS_KC_HEAP: -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:MaxRAMPercentage=65
    secrets:
      - keycloak_app_db_password
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-58180}:8080"
      - "127.0.0.1:${KEYCLOAK_ADMIN_HTTP_PORT:-58181}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status"[ ]*:[ ]*"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    networks:
      keycloak_db: {}
      # Both loopback-published listeners are reached through this bridge.
      # Keep its gateway as Keycloak's only trusted reverse-proxy peer.
      keycloak_edge:
        gw_priority: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  keycloak_db:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${KEYCLOAK_DB_SUBNET:?set a non-conflicting Keycloak database subnet}
  keycloak_edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${KEYCLOAK_EDGE_SUBNET:?set an unused Keycloak edge subnet}
          gateway: ${KEYCLOAK_EDGE_GATEWAY:?set the Keycloak edge gateway}

volumes:
  keycloak_postgres_data:

secrets:
  keycloak_owner_db_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/keycloak_owner_db_password
  keycloak_app_db_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/keycloak_app_db_password

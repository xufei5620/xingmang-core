# 治理防篡改守卫。
#
# 关键：on:pull_request_target 始终使用 **base 分支（main）** 上的本文件与
# scripts/guard-governance-files.sh，PR 无法通过修改自己分支上的副本来绕过
# （对比 ci.yml 的 on:pull_request 跑的是 PR 头的版本——红队 Issue #17）。
#
# 安全：本工作流**不检出、不执行** PR 代码；只读取 PR 的文件名清单。
# permissions 保持只读，不使用任何 secret。
name: guard

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 base 分支（不是 PR 头）
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: 治理文件防篡改检查
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/guard-governance-files.sh
